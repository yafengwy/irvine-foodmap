    // ═══════════════ 沿途找餐厅 (Route mode) ═══════════════
    const API_KEY = new URL(document.querySelector('script[src*="maps/api/js"]').src).searchParams.get('key');

    document.querySelectorAll('#rt-limit button').forEach(b => b.addEventListener('click', () => {
        document.querySelectorAll('#rt-limit button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
    }));

    function openRouteModal() {
        document.getElementById('rt-progress').textContent = '';
        document.getElementById('route-modal').classList.add('open');
    }
    function closeRouteModal() { document.getElementById('route-modal').classList.remove('open'); }
    function rtProgress(t) { document.getElementById('rt-progress').textContent = t; }

    async function gpost(url, body, fieldMask) {
        const res = await fetch(url, {
            method: 'POST',
            // Send the full page URL as Referer (browser default sends only the domain,
            // which doesn't match the key's ".../irvine-foodmap/*" website restriction)
            referrerPolicy: 'no-referrer-when-downgrade',
            headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': API_KEY, 'X-Goog-FieldMask': fieldMask },
            body: JSON.stringify(body)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            const msg = (data.error && data.error.message) || res.status;
            const e = new Error(msg); e.status = res.status; throw e;
        }
        return data;
    }

    function getHere() {
        return new Promise((ok, fail) => navigator.geolocation
            ? navigator.geolocation.getCurrentPosition(p => ok({ lat: p.coords.latitude, lng: p.coords.longitude }),
                () => fail(new Error('无法获取当前位置，请填写起点')), { enableHighAccuracy: true, timeout: 8000 })
            : fail(new Error('无法获取当前位置，请填写起点')));
    }

    // Encoded polyline → [{lat,lng}]
    function decodePolyline(str) {
        let i = 0, lat = 0, lng = 0; const out = [];
        while (i < str.length) {
            for (const k of [0, 1]) {
                let b, shift = 0, result = 0;
                do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
                const d = (result & 1) ? ~(result >> 1) : (result >> 1);
                if (k === 0) lat += d; else lng += d;
            }
            out.push({ lat: lat / 1e5, lng: lng / 1e5 });
        }
        return out;
    }

    // Nearest point on route: distance (m), along-route distance (m), projected point
    function nearestOnRoute(path, cum, p) {
        const kx = 111320 * Math.cos(p.lat * Math.PI / 180), ky = 110540;
        let best = { d: Infinity };
        for (let i = 0; i < path.length - 1; i++) {
            const a = path[i], b = path[i + 1];
            const ax = (a.lng - p.lng) * kx, ay = (a.lat - p.lat) * ky;
            const bx = (b.lng - p.lng) * kx, by = (b.lat - p.lat) * ky;
            const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
            let t = L2 ? -(ax * dx + ay * dy) / L2 : 0; t = Math.max(0, Math.min(1, t));
            const x = ax + t * dx, y = ay + t * dy, d = Math.hypot(x, y);
            if (d < best.d) best = { d, along: cum[i] + t * (cum[i + 1] - cum[i]),
                pt: { lat: a.lat + t * (b.lat - a.lat), lng: a.lng + t * (b.lng - a.lng) } };
        }
        return best;
    }
    function cumulative(path) {
        const cum = [0];
        for (let i = 1; i < path.length; i++) {
            const a = path[i - 1], b = path[i];
            const kx = 111320 * Math.cos(a.lat * Math.PI / 180);
            cum.push(cum[i - 1] + Math.hypot((b.lng - a.lng) * kx, (b.lat - a.lat) * 110540));
        }
        return cum;
    }

    const fmtMi  = m => (m / 1609.34 < 10 ? (m / 1609.34).toFixed(1) : Math.round(m / 1609.34)) + ' mi';
    const fmtDur = s => { const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h ? `${h}小时${m}分` : `${m}分钟`; };
    const secs   = d => parseInt(d || '0', 10);

    const CORRIDOR_M = 8000;     // pre-filter: within ~5 miles of the route
    const MAX_SAVED = 25, MAX_GOOGLE = 20;

    async function runRoute() {
        const fromTxt = document.getElementById('rt-from').value.trim();
        const toTxt   = document.getElementById('rt-to').value.trim();
        if (!toTxt) { rtProgress('请填写终点'); return; }
        const limit     = +document.querySelector('#rt-limit button.active').dataset.min;
        const useGoogle = document.getElementById('rt-google').checked;
        const kw        = document.getElementById('rt-kw').value.trim() || 'restaurant';
        const go = document.getElementById('rt-go'); go.disabled = true;

        try {
            const fromEl = document.getElementById('rt-from'), toEl = document.getElementById('rt-to');
            let origin;
            if (fromTxt) origin = fromEl.dataset.placeId ? { placeId: fromEl.dataset.placeId } : { address: fromTxt };
            else {
                rtProgress('正在获取当前位置…');
                const h = await getHere();
                origin = { location: { latLng: { latitude: h.lat, longitude: h.lng } } };
            }
            rtProgress('正在计算路线…');
            const destination = toEl.dataset.placeId ? { placeId: toEl.dataset.placeId } : { address: toTxt };
            const FM = 'routes.duration,routes.distanceMeters,routes.polyline.encodedPolyline,routes.description';
            const base = { origin, destination, travelMode: 'DRIVE', routingPreference: 'TRAFFIC_AWARE', languageCode: 'zh-CN' };
            const viaEl = document.getElementById('rt-via'), viaTxt = viaEl.value.trim();
            let list;
            if (viaTxt) {
                // 途经: only routes that pass through this point (no direct route)
                const v = await gpost('https://routes.googleapis.com/directions/v2:computeRoutes', {
                    ...base, intermediates: [{ via: true, ...(viaEl.dataset.placeId ? { placeId: viaEl.dataset.placeId } : { address: viaTxt }) }]
                }, FM);
                if (!v.routes || !v.routes.length) throw new Error('找不到经过「' + viaTxt + '」的路线');
                list = v.routes.slice(0, 1).map(r => ({ ...r, description: '经 ' + viaTxt.split(',')[0] + (r.description ? ' · ' + r.description : '') }));
            } else {
                const data = await gpost('https://routes.googleapis.com/directions/v2:computeRoutes',
                    { ...base, computeAlternativeRoutes: true }, FM);
                if (!data.routes || !data.routes.length) throw new Error('找不到路线，请检查起点和终点');
                list = data.routes.slice(0, 3);
            }

            const routes = list.map(r => {
                const path = decodePolyline(r.polyline.encodedPolyline);
                return { ...r, path, cum: cumulative(path) };
            });

            // Exit other modes, enter route mode
            if (singleId) singleId = null;
            clearRoute();
            routeState = { routes, sel: 0, limit, useGoogle, kw, cands: {} };
            await computeCandidates(0);
            closeRouteModal();
            showRoute();
        } catch (e) {
            const m = String(e.message || e);
            if (e.status === 403 || /not been used|disabled|API_KEY|blocked/i.test(m))
                rtProgress('⚠️ Google API 还没开通或 key 没授权：' + m.slice(0, 160));
            else rtProgress('⚠️ ' + m);
            console.error(e);
        } finally { go.disabled = false; }
    }

    // Find restaurants near route #idx and compute real detour times (cached per route)
    async function computeCandidates(idx) {
        if (routeState.cands[idx]) return;
        const rt = routeState.routes[idx];
        let list = [];

        // 1) Saved restaurants near the corridor
        restaurants.filter(r => r.lat && r.lng).forEach(r => {
            const n = nearestOnRoute(rt.path, rt.cum, { lat: r.lat, lng: r.lng });
            if (n.d <= CORRIDOR_M) list.push({ kind: 'saved', id: r.id, r, lat: r.lat, lng: r.lng, name: r.name, ...n });
        });
        list.sort((a, b) => a.d - b.d); list = list.slice(0, MAX_SAVED);

        // 2) Optional: Google places along the route
        if (routeState.useGoogle) {
            rtProgress('正在搜索沿途餐厅…');
            try {
                const g = await gpost('https://places.googleapis.com/v1/places:searchText', {
                    textQuery: routeState.kw, maxResultCount: MAX_GOOGLE,
                    searchAlongRouteParameters: { polyline: { encodedPolyline: rt.polyline.encodedPolyline } }
                }, 'places.id,places.displayName,places.formattedAddress,places.location,places.rating,places.userRatingCount,places.primaryTypeDisplayName');
                (g.places || []).forEach(pl => {
                    const p = { lat: pl.location.latitude, lng: pl.location.longitude };
                    const name = pl.displayName ? pl.displayName.text : '';
                    // skip ones already saved (same spot)
                    if (restaurants.some(r => Math.abs(r.lat - p.lat) < 0.0008 && Math.abs(r.lng - p.lng) < 0.0008)) return;
                    const n = nearestOnRoute(rt.path, rt.cum, p);
                    list.push({ kind: 'google', id: 'g_' + pl.id, name, address: pl.formattedAddress || '',
                        rating: pl.rating, count: pl.userRatingCount,
                        type: pl.primaryTypeDisplayName ? pl.primaryTypeDisplayName.text : '', ...p, ...n });
                });
            } catch (e) { console.error(e); showMapMsg('⚠️ 沿途 Google 搜索失败', true); }
        }

        // 3) Real drive time (with live traffic) from nearest route point → restaurant; detour ≈ ×2
        rtProgress(`正在计算绕路时间（${list.length} 家）…`);
        await Promise.all(list.map(async c => {
            try {
                const m = await gpost('https://routes.googleapis.com/distanceMatrix/v2:computeRouteMatrix', {
                    origins: [{ waypoint: { location: { latLng: { latitude: c.pt.lat, longitude: c.pt.lng } } } }],
                    destinations: [{ waypoint: { location: { latLng: { latitude: c.lat, longitude: c.lng } } } }],
                    travelMode: 'DRIVE', routingPreference: 'TRAFFIC_AWARE'
                }, 'originIndex,destinationIndex,duration,distanceMeters,condition');
                const el = Array.isArray(m) ? m[0] : null;
                c.detourMin = el && el.duration ? Math.round(secs(el.duration) * 2 / 60) : null;
            } catch (e) { c.detourMin = null; console.error(e); }
        }));
        // Fallback when drive time unavailable: rough estimate from straight distance (~30 mph)
        list.forEach(c => { if (c.detourMin == null) { c.detourMin = Math.round(c.d * 1.4 * 2 / 13.4 / 60); c.estimated = true; } });
        list.sort((a, b) => a.along - b.along);
        routeState.cands[idx] = list;
        rtProgress('');
    }

    function showRoute() {
        const st = routeState, rt = st.routes[st.sel];
        // Lines: selected route blue & thick, alternatives grey & clickable
        routeLines.forEach(l => l.setMap(null)); routeLines = [];
        st.routes.forEach((r, i) => {
            const line = new google.maps.Polyline({
                path: r.path, map,
                strokeColor: i === st.sel ? '#1a73e8' : '#9aa0a6',
                strokeOpacity: i === st.sel ? 0.9 : 0.7, strokeWeight: i === st.sel ? 6 : 4,
                zIndex: i === st.sel ? 2 : 1, clickable: i !== st.sel
            });
            if (i !== st.sel) line.addListener('click', () => selectRoute(i));
            routeLines.push(line);
        });

        const shown = st.cands[st.sel].filter(c => c.detourMin <= st.limit);
        const saved = shown.filter(c => c.kind === 'saved').map(c => c.r);

        // Markers: saved ones use normal markers; Google ones get blue-label markers
        renderMarkers(saved);
        gMarkers.forEach(m => { try { m.map = null; } catch (e) {} }); gMarkers = [];
        shown.filter(c => c.kind === 'google').forEach(c => {
            const el = document.createElement('div');
            el.className = 'custom-marker g-marker';
            el.innerHTML = `<span class="flag">📍</span><span class="mname">${formatMarkerName(c.name)}</span>`;
            const mk = new google.maps.marker.AdvancedMarkerElement({ position: { lat: c.lat, lng: c.lng }, map, content: el, title: c.name });
            mk._id = c.id;
            mk.addListener('click', () => openGoogleInfo(mk, c));
            gMarkers.push(mk);
        });
        const b = new google.maps.LatLngBounds(); rt.path.forEach(p => b.extend(p));
        map.fitBounds(b);

        renderRouteBar(shown.length);
        renderRouteList(shown);
        // Keep panel as the user left it (collapsed = full map)
    }

    function renderRouteBar(n) {
        const st = routeState, rt = st.routes[st.sel];
        const routeChips = st.routes.length > 1 ? `<div class="rb-row">${st.routes.map((r, i) =>
            `<button class="rb-chip${i === st.sel ? ' active' : ''}" onclick="selectRoute(${i})">${escHtml(r.description || '路线' + (i + 1))} · ${fmtDur(secs(r.duration))}</button>`).join('')}</div>` : '';
        const limitChips = `<div class="rb-row">${[5, 10, 15, 20].map(m =>
            `<button class="rb-chip${m === st.limit ? ' active' : ''}" onclick="setRouteLimit(${m})">≤${m}分钟</button>`).join('')}</div>`;
        const bar = document.getElementById('route-bar');
        bar.innerHTML = `
            <div class="rb-top">
                <span>🧭 ${escHtml(rt.description || '')} · ${fmtMi(rt.distanceMeters)} · ${fmtDur(secs(rt.duration))} · 沿途 <b>${n}</b> 家</span>
                <button class="rb-exit" onclick="exitRoute()">退出路线</button>
            </div>${routeChips}${limitChips}`;
        bar.classList.add('visible');
        document.getElementById('list-title').textContent = `🧭 沿途餐厅 (${n})`;
        document.getElementById('single-bar').classList.remove('visible');
    }

    function renderRouteList(shown) {
        const c = document.getElementById('rest-list');
        if (!shown.length) {
            c.innerHTML = `<div class="empty-message">这条路线 ${routeState.limit} 分钟绕路内没有餐厅 😕<br>试试放宽绕路时间${routeState.useGoogle ? '' : '，或打开 Google 搜索'}</div>`;
            return;
        }
        c.innerHTML = shown.map(x => {
            const cls = x.detourMin <= 5 ? '' : x.detourMin <= 12 ? ' mid' : ' far';
            const badge = `<span class="detour-badge${cls}">🚗 绕路约 ${x.detourMin} 分钟${x.estimated ? '（估算）' : ''}</span><span class="meta" style="display:inline">距起点 ${fmtMi(x.along)}</span>`;
            if (x.kind === 'saved') {
                const r = x.r;
                const mapsUrl = `https://maps.google.com/?q=${encodeURIComponent(r.name + ' ' + r.address)}`;
                return `
                <div class="rest-card" data-id="${r.id}" onclick="focusMarker('${r.id}')">
                    <div class="name">${escHtml(r.name)}</div>
                    ${badge}
                    <div class="meta">📍 <a class="nav-link" href="${mapsUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${escHtml(r.address)}</a></div>
                    <span class="tag-cuisine ${cuisineClass(r.cuisine)}">${escHtml(r.cuisine)}</span>
                </div>`;
            }
            const mapsUrl = `https://maps.google.com/?q=${encodeURIComponent(x.name + ' ' + x.address)}`;
            const rating = x.rating ? ` · ⭐ ${x.rating}${x.count ? ` (${x.count})` : ''}` : '';
            return `
                <div class="rest-card" data-id="${x.id}" onclick="focusGoogle('${x.id}')">
                    <div class="name"><span class="g-badge">Google</span>${escHtml(x.name)}</div>
                    ${badge}
                    <div class="meta">📍 <a class="nav-link" href="${mapsUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${escHtml(x.address)}</a></div>
                    <div class="meta">${escHtml(x.type || '')}${rating}</div>
                    <button class="g-save-btn" onclick="event.stopPropagation();saveGooglePlace('${x.id}')">＋ 收藏到我的地图</button>
                </div>`;
        }).join('');
    }

    function findCand(id) { return routeState && routeState.cands[routeState.sel].find(c => c.id === id); }

    function openGoogleInfo(mk, c) {
        const mapsUrl = `https://maps.google.com/?q=${encodeURIComponent(c.name + ' ' + c.address)}`;
        infoWindow.setContent(`
            <div class="info-window-content">
                <h4 style="cursor:pointer;text-decoration:underline dotted;" onclick="highlightCard('${c.id}')">${escHtml(c.name)}</h4>
                <p>📍 <a class="iw-nav" href="${mapsUrl}" target="_blank" rel="noopener">${escHtml(c.address)}</a></p>
                <p>🚗 绕路约 ${c.detourMin} 分钟${c.rating ? ' · ⭐ ' + c.rating : ''}</p>
                <button class="g-save-btn" onclick="saveGooglePlace('${c.id}')">＋ 收藏到我的地图</button>
            </div>`);
        infoWindow.open(map, mk);
    }
    function focusGoogle(id) {
        const mk = gMarkers.find(m => m._id === id), c = findCand(id);
        if (mk && c) { openGoogleInfo(mk, c); map.panTo({ lat: c.lat, lng: c.lng }); }
    }
    function highlightCard(id) {
        infoWindow.close();
        const card = document.querySelector(`.rest-card[data-id="${id}"]`);
        if (!card) return;
        restorePanel();
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.style.outline = '2.5px solid #e8472a';
        setTimeout(() => { card.style.outline = ''; }, 1800);
    }
    function saveGooglePlace(id) {
        const c = findCand(id); if (!c) return;
        infoWindow.close();
        openNewForm();
        document.getElementById('add-name').value = c.name;
        document.getElementById('add-address').value = c.address;
    }

    async function selectRoute(i) {
        if (!routeState || i === routeState.sel) return;
        routeState.sel = i;
        if (!routeState.cands[i]) {
            showMapMsg('正在计算这条路线的沿途餐厅…', false);
            await computeCandidates(i);
        }
        showRoute();
    }
    function setRouteLimit(m) { routeState.limit = m; showRoute(); }

    // Address suggestions while typing (Places Autocomplete, debounced)
    function setupPlaceAC(input, withHere) {
        const menu = input.parentElement.querySelector('.dd-menu');
        let timer = null, token = null, items = [];
        const newToken = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
        const hide = () => menu.classList.remove('open');
        function render() {
            if (!items.length) { hide(); return; }
            menu.innerHTML = items.map((it, i) => it.here
                ? `<div class="dd-item" data-i="${i}"><div class="ac-main">📍 当前位置</div></div>`
                : `<div class="dd-item" data-i="${i}"><div class="ac-main">${escHtml(it.main)}</div>${it.sub ? `<div class="ac-sub">${escHtml(it.sub)}</div>` : ''}</div>`).join('');
            menu.classList.add('open');
        }
        async function fetchAC(q) {
            const c = map ? map.getCenter() : null;
            try {
                const d = await gpost('https://places.googleapis.com/v1/places:autocomplete', {
                    input: q, sessionToken: token,
                    ...(c ? { locationBias: { circle: { center: { latitude: c.lat(), longitude: c.lng() }, radius: 50000 } } } : {})
                }, 'suggestions.placePrediction.placeId,suggestions.placePrediction.text,suggestions.placePrediction.structuredFormat');
                if (input.value.trim() !== q) return;   // stale response
                items = (d.suggestions || []).filter(x => x.placePrediction).slice(0, 5).map(x => {
                    const p = x.placePrediction, sf = p.structuredFormat || {};
                    return { placeId: p.placeId, text: p.text ? p.text.text : '',
                             main: sf.mainText ? sf.mainText.text : (p.text ? p.text.text : ''),
                             sub: sf.secondaryText ? sf.secondaryText.text : '' };
                });
                render();
            } catch (e) { console.error(e); hide(); }
        }
        input.addEventListener('focus', () => {
            token = newToken();
            if (withHere && !input.value.trim()) { items = [{ here: true }]; render(); }
        });
        input.addEventListener('input', () => {
            delete input.dataset.placeId;
            clearTimeout(timer);
            const q = input.value.trim();
            if (q.length < 2) { items = withHere && !q ? [{ here: true }] : []; render(); return; }
            timer = setTimeout(() => fetchAC(q), 350);
        });
        input.addEventListener('blur', () => hideAfterBlur(menu, hide));
        onMenuPick(menu, el => {
            const it = items[+el.dataset.i];
            if (it.here) { input.value = ''; delete input.dataset.placeId; }
            else { input.value = it.text; input.dataset.placeId = it.placeId; }
            token = newToken();   // selection ends the session
            hide(); input.blur();
        });
    }
    setupPlaceAC(document.getElementById('rt-from'), true);
    setupPlaceAC(document.getElementById('rt-to'), false);
    setupPlaceAC(document.getElementById('rt-via'), false);

    function clearRoute() {
        routeState = null;
        routeLines.forEach(l => l.setMap(null)); routeLines = [];
        gMarkers.forEach(m => { try { m.map = null; } catch (e) {} }); gMarkers = [];
        const bar = document.getElementById('route-bar');
        bar.classList.remove('visible'); bar.innerHTML = '';
    }
    function exitRoute() { clearRoute(); applyFilters(); }

    // Menu tap handling: tap picks an item, drag scrolls the list instead of selecting
    function onMenuPick(menu, pick) {
        let startY = 0, moved = false;
        menu.addEventListener('touchstart', e => { moved = false; startY = e.touches[0].clientY; menu.dataset.touching = '1'; }, { passive: true });
        menu.addEventListener('touchmove',  e => { if (Math.abs(e.touches[0].clientY - startY) > 8) moved = true; }, { passive: true });
        menu.addEventListener('touchend',   e => {
            menu.dataset.touching = '';
            if (moved) return;                       // it was a scroll, not a tap
            const item = e.target.closest('.dd-item');
            if (item) { e.preventDefault(); pick(item); }
        });
        menu.addEventListener('click', e => {        // desktop / mouse
            const item = e.target.closest('.dd-item');
            if (item) pick(item);
        });
    }
    function hideAfterBlur(menu, hide) {
        setTimeout(() => { if (menu.dataset.touching !== '1') hide(); }, 200);
    }

    // Custom dropdowns for 菜式 / 标签 (options come from the hidden datalists)
    function setupDropdown(input) {
        const wrap  = input.parentElement;
        const menu  = wrap.querySelector('.dd-menu');
        const arrow = wrap.querySelector('.dd-arrow');
        const listId = input.dataset.dd;
        const isTag = input.id === 'add-tag-input';

        function options(filter) {
            const dl = document.getElementById(listId);
            let opts = dl ? [...dl.options].map(o => o.value) : [];
            if (isTag) opts = opts.filter(t => !formTags.has(t));
            const q = filter ? input.value.trim().toLowerCase() : '';
            return q ? opts.filter(o => o.toLowerCase().includes(q)) : opts;
        }
        function show(filter) {
            const opts = options(filter);
            if (!opts.length) { menu.classList.remove('open'); return; }
            menu.innerHTML = opts.map(o => `<div class="dd-item">${escHtml(o)}</div>`).join('');
            menu.classList.add('open');
        }
        function hide() { menu.classList.remove('open'); }

        // Tap arrow: toggle full list
        arrow.addEventListener('pointerdown', e => {
            e.preventDefault();
            if (menu.classList.contains('open')) hide(); else show(false);
        });
        input.addEventListener('focus', () => show(false));
        input.addEventListener('input', () => show(true));
        input.addEventListener('blur', () => hideAfterBlur(menu, hide));
        onMenuPick(menu, item => {
            input.value = item.textContent;
            hide();
            if (isTag) addTagToForm();
        });
    }
    document.querySelectorAll('input[data-dd]').forEach(setupDropdown);

    // Drag the orange header down to force-refresh (works in home-screen app)
    (function () {
        const header = document.querySelector('header');
        const ind = document.getElementById('ptr-indicator');
        const TRIGGER = 70;
        let startY = null, dy = 0;
        header.addEventListener('touchstart', e => { startY = e.touches[0].clientY; dy = 0; }, { passive: true });
        header.addEventListener('touchmove', e => {
            if (startY === null) return;
            dy = Math.max(0, e.touches[0].clientY - startY);
            const y = Math.min(dy, 120) - 60;
            ind.style.transform = `translate(-50%, ${y}px)`;
            ind.textContent = dy > TRIGGER ? '↻ 松开刷新' : '↓ 下拉刷新';
        }, { passive: true });
        header.addEventListener('touchend', () => {
            if (startY === null) return;
            if (dy > TRIGGER) {
                ind.textContent = '刷新中…';
                ind.style.transform = 'translate(-50%, 50px)';
                // Cache-busting param so the newest index.html is fetched
                location.replace(location.pathname + '?r=' + Date.now());
            } else {
                ind.style.transform = 'translate(-50%, -60px)';
            }
            startY = null; dy = 0;
        });
    })();

    function focusMarker(id) {
        const m = markers.find(m => m._id === id);
        if (m) { openInfoWindow(m, restaurants.find(r=>r.id===id), `https://maps.google.com/?q=${encodeURIComponent((restaurants.find(r=>r.id===id)?.name||'')+' '+(restaurants.find(r=>r.id===id)?.address||''))}`); map.panTo(m.position || m.getPosition()); }
    }
</script>
