<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finance Track">
<meta name="theme-color" content="#F2F2F4">
<title>Finance Track</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300..600,0..1,0&display=block">
<style>
:root {
  --brand: #2F9E6E;
  --accent: #3478F6;
  --brand-soft: #E3F4EC;
  --bg: #F2F2F4;
  --card: #FFFFFF;
  --border: #E6E6EA;
  --line: #EDEDF0;
  --text: #1C1C1E;
  --sub: #8A8A8E;
  --inc: #1F9D63;
  --exp: #D93025;
  --good: #1F7A4F;
  --bad: #C0271B;
  --grey: #80868F;
  --link: #3478F6;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Noto Sans SC', sans-serif; font-size: 16px; font-weight: 400; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.ms { font-variation-settings: 'FILL' 0, 'wght' 350; font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga'; }

#app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(96px + var(--safe-bottom)); }

/* header */
.top { background: rgba(242,242,244,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); color: var(--text); padding: calc(var(--safe-top) + 6px) 12px 8px; position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 8px; height: 52px; }
.bar h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 600; text-align: center; }
.icon-btn.round { background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.08); color: var(--text); text-decoration: none; }
.icon-btn { width: 44px; height: 44px; border: 0; background: none; color: inherit; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.icon-btn .ms { font-size: 24px; }
.tabs { display: flex; gap: 2px; padding: 3px; background: #E4E4E8; border-radius: 10px; margin: 4px 4px 0; }
.tabs a { flex: 1; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: var(--text); text-decoration: none; border-radius: 8px; }
.tabs a[aria-current="page"] { background: #fff; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.1); }

.page { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.h2 { font-size: 17px; font-weight: 600; margin: 0; }
.meta { font-size: 12px; color: var(--sub); }
.pill-btn { height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.pill-btn .ms { font-size: 18px; }
.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.danger { color: var(--bad); }

/* accounts */
.acc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { position: relative; border: 0; border-radius: 12px; padding: 10px; height: 84px; color: #fff; text-align: left; display: flex; flex-direction: column; justify-content: space-between; }
.tile .nm { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .sb { font-size: 11px; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .amt { font-size: 16px; font-weight: 600; }
.tile .dot { position: absolute; top: -4px; right: -4px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--bg); }
.tile.add { background: var(--card); color: var(--link); border: 1.5px solid #C9CED8; align-items: center; justify-content: center; flex-direction: row; gap: 4px; font-weight: 600; font-size: 13px; }
.banner { background: var(--card); border: 0; border-radius: 14px; padding: 14px; display: flex; gap: 12px; }
.banner .ms { color: var(--exp); font-size: 22px; }
.banner .t { font-weight: 600; font-size: 14px; }
.empty { background: var(--card); border-radius: 14px; padding: 24px 16px; text-align: center; color: var(--sub); display: flex; flex-direction: column; gap: 12px; align-items: center; }

/* cards */
.card { background: var(--card); border: 0; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card-head { display: flex; align-items: flex-start; gap: 8px; }
.card-head > div { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.card-head .icon-btn { color: var(--sub); margin: -8px -10px 0 0; }
.big { font-size: 32px; font-weight: 600; letter-spacing: -0.5px; }
.bar-row { display: flex; flex-direction: column; gap: 6px; }
.track { height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; }
.fill { height: 100%; border-radius: 999px; }
.sec-head { display: flex; justify-content: space-between; align-items: center; min-height: 36px; padding: 0 4px; font-size: 13px; font-weight: 400; color: var(--sub); }

.cat-row { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.cat-btn { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 0; border: 0; background: none; text-align: left; }
.cat-btn .n { flex: 1; font-weight: 400; display: flex; align-items: center; gap: 2px; min-width: 0; }
.cat-btn .a { font-weight: 600; }
.cat-btn .p { width: 52px; text-align: right; font-size: 13px; font-weight: 600; }
.chev { font-size: 20px; color: var(--sub); transition: transform .15s; }
.cat-row.open > .cat-line .chev, .pick.open .chev { transform: rotate(180deg); }
.subs { padding: 0 0 6px 44px; }
.sub { display: flex; align-items: center; gap: 12px; min-height: 40px; border-top: 1px dashed var(--line); font-size: 14px; color: var(--sub); }
.sub .n { flex: 1; }
.sub .p { width: 52px; text-align: right; font-size: 12px; }
.ci { width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; }
.ci .ms { font-size: 18px; font-variation-settings: 'FILL' 1, 'wght' 500; }
.ci.unknown { background: #9AA0A8; }
.ci.lg { width: 96px; height: 96px; }
.ci.lg .ms { font-size: 48px; }

/* transactions */
.chips { display: flex; gap: 8px; overflow-x: auto; }
.chip { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-size: 14px; font-weight: 600; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.day { font-size: 13px; font-weight: 600; color: var(--sub); padding: 8px 4px 4px; }
.list { background: var(--card); border: 0; border-radius: 14px; overflow: hidden; }
.tx { display: flex; align-items: center; gap: 4px; width: 100%; min-height: 60px; padding: 0 14px 0 6px; border-top: 1px solid var(--line); }
.tx:first-child { border-top: 0; }
.tx-ico { width: 48px; height: 56px; flex-shrink: 0; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; }
.tx-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 56px; border: 0; background: none; text-align: left; padding: 0; color: inherit; }
.tx .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tx .n { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .a { font-weight: 600; }
.tx.transfer { color: var(--grey); }
.tx.transfer .a { text-decoration: line-through; }
.tag { display: inline-block; white-space: nowrap; font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 6px; background: var(--line); color: var(--sub); }

/* settings lists */
.set-list { background: var(--card); border: 0; border-radius: 14px; overflow: hidden; }
.set-item { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 8px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; text-decoration: none; color: var(--text); }
.set-item:first-child { border-top: 0; }
.set-item .n { flex: 1; font-weight: 400; }
.set-item .v { color: var(--sub); }
.set-item.hidden-cat { opacity: .45; }
.center { display: flex; justify-content: center; padding: 8px 0; }
.icon-edit { position: relative; border: 0; background: none; padding: 0; border-radius: 50%; }
.icon-edit .pen { position: absolute; right: -2px; bottom: -2px; width: 32px; height: 32px; border-radius: 50%; background: #EAF1FF; color: var(--link); display: flex; align-items: center; justify-content: center; }
.switch { appearance: none; width: 52px; height: 32px; border-radius: 999px; background: #C9CED8; position: relative; transition: background .15s; margin: 0; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch:checked { background: #34C759; }
.switch:checked::after { left: 23px; }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--line); border-radius: 999px; }
.seg button { height: 32px; padding: 0 14px; border: 0; border-radius: 999px; background: none; font-size: 13px; font-weight: 600; color: var(--sub); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(21,24,29,.12); }

/* drawer + sheet */
.scrim { position: fixed; inset: 0; background: rgba(15,17,20,.45); z-index: 20; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 82vw); background: var(--card); z-index: 21; padding: calc(var(--safe-top) + 16px) 8px 16px; display: flex; flex-direction: column; gap: 2px; }
.drawer .who { display: flex; align-items: center; gap: 12px; padding: 8px 12px 16px; font-size: 13px; color: var(--sub); border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.who-logo { width: 44px; height: 44px; border-radius: 11px; box-shadow: 0 2px 8px rgba(24,120,104,.25); flex-shrink: 0; }
.who-name { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.drawer a, .drawer button { display: flex; align-items: center; gap: 14px; min-height: 50px; padding: 0 12px; border: 0; border-radius: 10px; background: none; text-decoration: none; color: var(--text); font-weight: 400; font-size: 16px; text-align: left; }
.drawer .ms { color: var(--accent); font-size: 24px; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto; background: var(--card); z-index: 21; border-radius: 18px 18px 0 0; padding: 12px 16px calc(20px + var(--safe-bottom)); display: flex; flex-direction: column; gap: 14px; max-width: 560px; margin: 0 auto; }
.sheet > * { flex-shrink: 0; }
.sheet { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: manipulation; }
body.sheet-open { overflow: hidden; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: #D5D9E0; }
.sheet-top { position: sticky; top: -12px; z-index: 2; margin: -12px -16px 0; padding: 8px 12px 4px; background: var(--card); display: flex; justify-content: center; align-items: flex-start; min-height: 52px; }
.sheet-x { position: absolute; right: 12px; top: 8px; width: 36px; height: 36px; }
.sheet-x .ms { font-size: 20px; }
.sticky-save { position: sticky; bottom: calc(-20px - var(--safe-bottom)); margin: 4px -16px calc(-20px - var(--safe-bottom)); padding: 10px 16px calc(14px + var(--safe-bottom)); background: linear-gradient(rgba(255,255,255,0), #fff 30%); }
.sticky-save .pill-btn { width: 100%; justify-content: center; height: 50px; font-size: 17px; border-radius: 14px; }
.sheet h3 { margin: 0; font-size: 18px; font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--sub); }
.input { height: 46px; border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; background: #fff; font-size: 16px; }
.opt { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 4px; border-bottom: 1px solid var(--line); }
.opt input { width: 20px; height: 20px; accent-color: var(--brand); }
.pick { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 4px; border: 0; border-radius: 10px; background: none; text-align: left; }
.pick.sub { padding-left: 44px; min-height: 44px; }
.pick[aria-pressed="true"] { background: #E3F1EA; }
.pick .n { flex: 1; font-weight: 400; }
.grid-icons { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.grid-icons button { height: 48px; border-radius: 12px; border: 1px solid var(--border); background: #fff; display: flex; align-items: center; justify-content: center; }
.grid-icons button[aria-pressed="true"] { border: 2px solid var(--brand); background: #E3F1EA; }
.swatches { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
.swatches button { aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent; }
.swatches button[aria-pressed="true"] { border-color: var(--text); }
.btns { display: flex; gap: 10px; }
.btns .pill-btn { flex: 1; justify-content: center; height: 48px; font-size: 15px; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.check input { width: 20px; height: 20px; accent-color: var(--brand); }

.fab { position: fixed; right: max(20px, calc(50vw - 260px)); bottom: calc(24px + var(--safe-bottom)); width: 60px; height: 60px; border-radius: 50%; border: 0; background: #2563EB; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(37,99,235,.35); z-index: 6; }
.fab .ms { font-size: 30px; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip .ms { font-size: 16px; vertical-align: -3px; }
select.input { appearance: auto; }
.searchbar { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 0 6px 0 12px; height: 46px; }
.searchbar > .ms { color: var(--sub); }
.searchbar input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; height: 100%; }
.loadall { display: inline-flex; align-items: center; gap: 3px; height: 32px; padding: 0 8px; border: 1px solid var(--border); border-radius: 999px; background: none; font-size: 12px; font-weight: 600; color: var(--sub); white-space: nowrap; }
.loadall .ms { font-size: 16px; }
.loadall[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.freq { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.freq button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 2px; border: 0; border-radius: 12px; background: none; font-size: 12px; font-weight: 600; }
.freq button span:last-child { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.freq button[aria-pressed="true"] { background: #E3F1EA; }
.freq .ci { width: 44px; height: 44px; }
.freq .ci .ms { font-size: 22px; }
.pick.open .chev { transform: rotate(180deg); }
.pick .chev { margin-left: auto; }
.amount-row { display: flex; align-items: baseline; justify-content: flex-end; gap: 0; font-size: 44px; font-weight: 600; padding: 4px 4px 0; }
.amount-row input { max-width: 75%; text-align: right; padding: 0; border: 0; outline: 0; background: none; font: inherit; font-size: 44px; font-weight: 600; }
.set-item > .ms { color: var(--accent); width: 32px; text-align: center; }
.wide { width: 100%; justify-content: center; height: 48px; }
.row-select { margin-left: auto; max-width: 62%; height: 36px; border: 0; background: none; color: var(--sub); font-size: 16px; text-align: right; direction: rtl; }
input.row-select { direction: ltr; }
.row-select:focus { outline: none; color: var(--accent); }
.msel-top { display: flex; align-items: center; border-top: 1px solid var(--line); }
.set-list > .msel-top:first-child { border-top: 0; }
.msel-top .msel-row { flex: 1; border: 0; }
.msel-row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 4px 14px; border-top: 1px solid var(--line); }
.msel-row.sub { padding-left: 52px; }
.set-list > .msel-row:first-child { border-top: 0; }
.msel-row input { width: 22px; height: 22px; accent-color: var(--accent); flex-shrink: 0; }
.msel-row .n { flex: 1; }
.chev.up { transform: rotate(180deg); }
.drawer-sep { height: 1px; background: var(--line); margin: 8px 12px; }
.sec-head .meta { font-size: 12px; }
.ci.sq { border-radius: 8px; }
.opt-row .check-ico { color: var(--accent); font-size: 22px; margin-left: auto; }
.opt-row[aria-pressed="true"] .n { font-weight: 600; }
.lbl { display: inline-flex; align-items: center; height: 17px; padding: 0 6px; border-radius: 4px; color: #fff; font-size: 10.5px; font-weight: 600; line-height: 1; white-space: nowrap; }
.lbls { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.lchip[aria-pressed="true"] { background: var(--lc); border-color: var(--lc); color: #fff; }
.lchip { border-color: var(--lc); color: var(--lc); }
.bare-input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; height: 40px; }
.row-date { margin-left: auto; border: 0; background: none; font-size: 16px; color: var(--sub); height: 36px; }
.set-item .v .lbl { vertical-align: middle; }
.sheet .set-item .v { max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.donut-wrap { position: relative; width: 220px; height: 220px; margin: 4px auto 0; }
.donut { width: 100%; height: 100%; overflow: visible; }
.donut circle { transition: stroke-width .15s; }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; padding: 0 56px; }
.dn-name { font-size: 13px; color: var(--sub); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dn-val { font-size: 20px; font-weight: 600; }
.legend-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px; padding: 0 4px; }
.legend { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; border: 0; background: none; padding: 0 6px; border-radius: 8px; font-size: 14px; color: var(--text); }
.legend .n { white-space: normal; text-align: left; }
.legend .sw { border-radius: 50%; }
.legend[aria-pressed="true"] { background: var(--bg); }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.trend { width: 100%; height: auto; display: block; }
.legend-inline { display: flex; gap: 16px; font-size: 12px; color: var(--sub); }
.legend-inline span { display: inline-flex; align-items: center; gap: 6px; }
.legend-inline i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend-inline i.ln { height: 2px; width: 14px; background: var(--text); border-radius: 1px; }
.top-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; border: 0; border-top: 1px solid var(--line); background: none; padding: 6px 0; text-align: left; }
.top-row .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.top-row .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-row .r { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.pill-btn.small { height: 34px; padding: 0 14px; font-size: 13px; color: var(--sub); background: transparent; border-color: var(--border); }
.pill-btn.small .ms { font-size: 16px; }
.reorder-row { gap: 10px; }
.reorder-row .icon-btn { width: 40px; height: 40px; color: var(--accent); }
.reorder-row .icon-btn:disabled { color: #D1D1D6; }
.update-bar { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--safe-top) + 8px); z-index: 40; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 10px 16px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; box-shadow: 0 4px 16px rgba(52,120,246,.35); white-space: nowrap; }
.update-bar .ms { font-size: 18px; }
.top-row.in-list { padding: 6px 14px; }
.list .top-row.in-list:first-child { border-top: 0; }
.card .link-btn { align-self: center; font-size: 13px; }
.card .link-btn.show-more { align-self: flex-start; padding: 8px 0; font-size: 14px; font-weight: 600; letter-spacing: .3px; }
.more-row { display: flex; gap: 12px; width: 100%; padding: 12px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; align-items: flex-start; }
.list .more-row:first-child { border-top: 0; }
.more-row .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n, sign = false) => `${n < 0 ? '-' : sign && n > 0 ? '+' : ''}$${fmt.format(Math.abs(n))}`;
const plain = (n) => `${n < 0 ? '-' : ''}${fmt.format(Math.abs(n))}`;
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseYmd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const icon = (name) => `<span class="ms" aria-hidden="true">${esc(name)}</span>`;
const shortDate = (s) => parseYmd(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

let toastTimer;
function toast(msg, ms = 3200) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
function errMsg(e) { return e?.message?.replace(/^.*?:\s*/, '') || String(e); }

// Categories can be 3 levels deep: main category → subcategory → sub-subcategory.
function topOf(cat) { let c = cat; while (c && c.parentId && S.cats[c.parentId]) c = S.cats[c.parentId]; return c || null; }
function lvl2Of(cat) { let c = cat; if (!c || !c.parentId) return null; while (c.parentId && S.cats[c.parentId]?.parentId) c = S.cats[c.parentId]; return c; }
function depthOf(cat) { let d = 0; let c = cat; while (c && c.parentId && S.cats[c.parentId]) { c = S.cats[c.parentId]; d++; } return d; }
// Each category is Income or Expense; a subcategory without its own setting follows its parent.
function catType(cat) { let c = cat; while (c) { if (c.type === 'income' || c.type === 'expense') return c.type; c = c.parentId ? S.cats[c.parentId] : null; } return 'expense'; }
function sideOf(t) { const c = S.cats[t.categoryId]; return c ? catType(c) : (t.amount < 0 ? 'income' : 'expense'); }
function descendants(id) { return subsOf(id).flatMap((s) => [s.id, ...descendants(s.id)]); }
function tops() { return Object.values(S.cats).filter((c) => !c.parentId).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)); }
function subsOf(id) { return Object.values(S.cats).filter((c) => c.parentId === id).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)); }
function visibleTops() { return tops().filter((c) => !c.hidden); }
function catColor(cat) { return topOf(cat)?.color || '#9AA0A8'; }
function catIcon(cat, lg = false) {
  if (!cat) return `<span class="ci unknown${lg ? ' lg' : ''}">${icon('help')}</span>`;
  return `<span class="ci${lg ? ' lg' : ''}" style="background:${esc(catColor(cat))}">${icon(cat.icon || 'category')}</span>`;
}
function sortedLabels() { return Object.values(S.labels).sort((a, b) => a.name.localeCompare(b.name)); }
// A record put directly on a category that has subcategories shows as "General – Name"
function txCatName(c) { return !c ? 'Uncategorized' : subsOf(c.id).length ? `General – ${c.name}` : c.name; }
// Row title: bank records show the bank's name; manual records show the Name you typed (or their category).
// txNoteLine: the note under the title (bank records only, so a manual note is not shown twice)
function txTitle(t) { return t.manual ? (t.name || txCatName(S.cats[t.categoryId])) : (t.merchant || t.name || t.note || ''); }
function txNoteLine(t) { return t.note && t.note !== txTitle(t) ? `<span class="note">${esc(t.note)}</span>` : ''; }
function accName(a) { return a ? (a.customName || a.name) : ''; }

// ---------- periods & card filters ----------
function getPeriod(card) {
  const def = { key: DEFAULT_PERIOD[card] || 'this_month' };
  try { const p = JSON.parse(localStorage.getItem('period:' + card)); return p && PERIOD_LABEL[p.key] ? p : def; } catch { return def; }
}
function setPeriod(card, p) { localStorage.setItem('period:' + card, JSON.stringify(p)); }
function rangeOf(p) {
  const now = new Date(); const y = now.getFullYear(); const m = now.getMonth();
  switch (p.key) {
    case 'last_month': return [ymd(new Date(y, m - 1, 1)), ymd(new Date(y, m, 0))];
    case 'this_year': return [ymd(new Date(y, 0, 1)), ymd(now)];
    case 'last_year': return [ymd(new Date(y - 1, 0, 1)), ymd(new Date(y - 1, 11, 31))];
    case 'last_30': return [ymd(addDays(now, -29)), ymd(now)];
    case 'last_6m': return [ymd(new Date(y, m - 5, 1)), ymd(now)];
    case 'last_12m': return [ymd(new Date(y, m - 11, 1)), ymd(now)];
    case 'custom': return [p.from || ymd(new Date(y, m, 1)), p.to || ymd(now)];
    default: return [ymd(new Date(y, m, 1)), ymd(now)];
  }
}
function prevRange([from, to]) {
  const f = parseYmd(from); const t = parseYmd(to);
  const days = Math.round((t - f) / 86400000) + 1;
  return [ymd(addDays(f, -days)), ymd(addDays(f, -1))];
}
function periodLabel(p) { return p.key === 'custom' ? `${shortDate(p.from)} – ${shortDate(p.to)}` : PERIOD_LABEL[p.key]; }

// A filter spec is { cats: [ids], labels: [ids] }. Picking a top category includes all of its subcategories.
function savedFilterId(card) { return localStorage.getItem('filter:' + card) || ''; }
// Each card can show All / Personal / Business (by the account's Business switch). Investments never count.
function cardScope(card) { return localStorage.getItem('scope:' + card) || 'all'; }
function cardSpec(card) {
  const sc = cardScope(card); const withScope = (spec) => (sc === 'all' ? spec : { ...(spec || {}), scope: sc });
  if (S.instant[card]) return { spec: withScope(S.instant[card]), label: 'Instant: ' + specName(S.instant[card]) };
  const f = S.filters[savedFilterId(card)];
  return f ? { spec: withScope(f), label: 'Filter: ' + f.name } : { spec: withScope(null), label: '' };
}
function hasBusiness() { return Object.values(S.accounts).some((a) => isBusiness(a) && !isInvest(a)); }
function specName(spec) {
  const names = [...(spec.accounts || []).map((id) => (S.accounts[id] ? accName(S.accounts[id]) + (S.accounts[id].mask ? ' ••' + S.accounts[id].mask : '') : null)),
    ...(spec.cats || []).map((id) => (id.startsWith('=') ? (S.cats[id.slice(1)] ? `General – ${S.cats[id.slice(1)].name}` : null) : S.cats[id]?.name)), ...(spec.labels || []).map((id) => '#' + (S.labels[id]?.name || ''))].filter(Boolean);
  return names.length > 3 ? `${names.slice(0, 3).join(', ')} +${names.length - 3}` : names.join(', ');
}
// ids -> Set of category ids that count. "=id" = only records put directly on id (its General row).
// A plain id means the whole branch, unless some of its subcategories are also listed
// (older saved filters) — then only the listed parts count.
function catSet(ids) {
  const list = new Set(ids); const cats = new Set();
  ids.forEach((id) => {
    if (id === '__none') return;
    if (id.startsWith('=')) { cats.add(id.slice(1)); return; }
    const ds = descendants(id);
    if (list.has('=' + id) || ds.some((d) => list.has(d) || list.has('=' + d))) return;
    cats.add(id); ds.forEach((d) => cats.add(d));
  });
  return cats;
}
function specMatcher(spec) {
  const accs = spec?.accounts?.length ? new Set(spec.accounts) : null;
  const hasCL = !!(spec?.cats?.length || spec?.labels?.length);
  const sc = spec?.scope && spec.scope !== 'all' ? spec.scope : null;
  if (!accs && !hasCL && !sc) return () => true;
  const cats = catSet(spec.cats || []);
  const labels = new Set(spec.labels || []);
  // Accounts narrow the result; within them a record shows if it is in a picked category OR has a picked label
  return (t) => (!sc || isBusiness(S.accounts[t.accountId]) === (sc === 'biz'))
    && (!accs || accs.has(t.accountId)) && (!hasCL || cats.has(t.categoryId) || (t.labels || []).some((l) => labels.has(l)));
}
function specEmpty(spec) { return !spec?.cats?.length && !spec?.labels?.length && !spec?.accounts?.length; }

// ---------- stats ----------
// Income vs expense comes from the money direction (Plaid: positive = money out), not from the category.
function stats([from, to], spec) {
  const ok = specMatcher(spec);
  const s = { income: 0, expense: 0, rows: {} };
  for (const t of S.txs) {
    if (t.date < from || t.date > to || t.isTransfer || !ok(t)) continue;
    const c = S.cats[t.categoryId]; const top = topOf(c);
    const side = sideOf(t);
    const key = `${side}:${top ? top.id : 'unknown'}`;
    const v = side === 'income' ? -t.amount : t.amount;
    s[side] += v;
    const row = s.rows[key] || (s.rows[key] = { key, side, catId: top?.id || null, total: 0, subs: {} });
    row.total += v;
    const subKey = lvl2Of(c)?.id || '_self';
    row.subs[subKey] = (row.subs[subKey] || 0) + v;
    if (subKey !== '_self') {
      const k3 = c.id === subKey ? '_self' : c.id;
      const m3 = (row.subs3 ||= {})[subKey] ||= {}; m3[k3] = (m3[k3] || 0) + v;
    }
  }
  return s;
}
function pctChange(cur, prev) { return prev ? Math.round(((cur - prev) / Math.abs(prev)) * 100) : null; }
function pctHtml(p, side) {
  if (p === null) return '<span class="p" style="color:var(--sub)">—</span>';
  const good = side === 'income' ? p >= 0 : p <= 0;
  return `<span class="p" style="color:var(${p === 0 ? '--sub' : good ? '--good' : '--bad'})">${p > 0 ? '+' : ''}${p}%</span>`;
}

// ---------- data ----------
function listen() {
  S.unsub.forEach((u) => u()); S.unsub = [];
  const watch = (name, key, after) => S.unsub.push(onSnapshot(collection(db, name), (snap) => {
    S[key] = {}; snap.forEach((d) => { S[key][d.id] = { id: d.id, ...d.data() }; });
    if (after) after(snap); render();
  }, onErr));
  watch('categories', 'cats', (snap) => { S.catsLoaded = true; if (snap.empty) seedCategories(); });
  watch('accounts', 'accounts', () => rebuildTxs());
  watch('labels', 'labels');
  watch('filters', 'filters');
  watch('rules', 'rules', () => { S.rulesLoaded = true; mergeDupRules(); scheduleRules(); });
  watch('items', 'items');
  watch('meta', 'meta');
  if (Object.keys(CARDS).some((c) => prevRange(rangeOf(getPeriod(c)))[0] < loadedSince())) S.loadAll = true;
  subscribeTx();
}
function loadedSince() { return `${new Date().getFullYear() - 1}-01-01`; }
function subscribeTx() {
  if (S.txUnsub) S.txUnsub();
  const col = collection(db, 'transactions');
  const q = S.loadAll ? query(col, orderBy('date', 'desc')) : query(col, where('date', '>=', loadedSince()), orderBy('date', 'desc'));
  S.txUnsub = onSnapshot(q, (snap) => {
    S.raw = []; S.rawById = {};
    snap.forEach((d) => { const t = { id: d.id, ...d.data() }; S.raw.push(t); S.rawById[t.id] = t; });
    rebuildTxs();
    S.txLoaded = true; scheduleRules(); render();
  }, onErr);
}
// A split record is stored once with splits: [{ amount, categoryId, isTransfer, note, labels }].
// Everywhere else it appears as separate parts with id "<recordId>~<n>".
// If the bank later changes the total (e.g. a tip added), the parts follow the split mode (see below).
// Investment accounts: Plaid type "investment" unless you switch it off (or on) in the account settings.
// Only their balance is used (Net Worth); their records stay out of Records, charts and rules.
function isInvest(a) { return !!a && (a.investment ?? a.type === 'investment'); }
function rebuildTxs() {
  S.txs = []; S.txById = {};
  for (const t of S.raw || []) {
    if (isInvest(S.accounts[t.accountId])) continue;
    for (const x of expandTx(t)) { S.txs.push(x); S.txById[x.id] = x; }
  }
}
function expandTx(t) {
  if (!Array.isArray(t.splits) || t.splits.length < 2) return [t];
  const { splits, ...base } = t;
  const total = Math.round(t.amount * 100); const n = splits.length;
  let cents = splits.map((x) => Math.round((Number(x.amount) || 0) * 100));
  // Recompute from the current total, so a changed bank amount follows the way it was split:
  // Equal → re-split evenly · Percent → same percentages · Amounts → the first (remainder) part absorbs it
  if (t.splitMode === 'equal') cents = cents.map(() => Math.trunc(total / n));
  else if (t.splitMode === 'pct' && splits.every((x) => x.pct != null)) cents = splits.map((x) => Math.round(total * x.pct / 100));
  cents[0] = total - cents.slice(1).reduce((a, b) => a + b, 0);
  // Amounts no longer fit (bank total dropped below the fixed parts): scale every part proportionally
  if (Math.sign(cents[0]) !== Math.sign(total) || !cents[0]) {
    const old = splits.reduce((a, x) => a + Math.round((Number(x.amount) || 0) * 100), 0);
    cents = splits.map((x) => (old ? Math.round(Math.round((Number(x.amount) || 0) * 100) * total / old) : Math.trunc(total / n)));
    cents[0] = total - cents.slice(1).reduce((a, b) => a + b, 0);
  }
  return splits.map((x, i) => ({
    ...base, id: `${t.id}~${i}`, parentId: t.id, splitIdx: i, splitN: splits.length,
    amount: cents[i] / 100, categoryId: x.categoryId || null, isTransfer: !!x.isTransfer, note: x.note || '', labels: x.labels || [],
  }));
}
// Write a change to records that may be split parts: fn(obj) returns the fields to change
function partOps(list, fn) {
  const ops = []; const byParent = {};
  list.forEach((t) => {
    if (!t.parentId) { ops.push((b) => b.update(doc(db, 'transactions', t.id), fn(t))); return; }
    const sp = byParent[t.parentId] ||= (S.rawById[t.parentId]?.splits || []).map((x) => ({ ...x }));
    Object.assign(sp[t.splitIdx] || {}, fn(sp[t.splitIdx] || {}));
  });
  Object.entries(byParent).forEach(([id, sp]) => ops.push((b) => b.update(doc(db, 'transactions', id), { splits: sp, categoryId: sp[0]?.categoryId || null })));
  return ops;
}
function setLoadAll(on) {
  if (S.loadAll === on) return;
  S.loadAll = on; subscribeTx();
  toast(on ? 'Loading all transactions…' : `Showing transactions since ${loadedSince().slice(0, 4)}`);
}
function onErr(e) { console.error(e); toast('Could not load data: ' + errMsg(e)); }

async function seedCategories() {
  if (S.seeding) return; S.seeding = true;
  const batch = writeBatch(db);
  SEED.forEach((c, i) => {
    const ref = doc(collection(db, 'categories'));
    batch.set(ref, { name: c.name, icon: c.icon, color: c.color, type: c.type || 'expense', hidden: false, parentId: null, order: i });
    c.subs.forEach(([name, ic, hidden], j) => {
      batch.set(doc(collection(db, 'categories')), { name, icon: ic, hidden: !!hidden, parentId: ref.id, order: j });
    });
  });
  try { await batch.commit(); } catch (e) { toast('Could not create categories: ' + errMsg(e)); }
  S.seeding = false;
}

// ---------- automatic rules ----------
// Runs in the app: each new transaction is checked once (marked ruled: true). Manual changes are never overwritten.
// Keyword rules with the same account and the same actions are kept as one rule
function sameRuleTarget(a, b) {
  return a.field === 'description' && b.field === 'description' && (a.accountId || null) === (b.accountId || null)
    && (a.categoryId || null) === (b.categoryId || null) && (a.labelId || null) === (b.labelId || null) && !!a.transfer === !!b.transfer
    && (a.amtMode || 'any') === (b.amtMode || 'any') && (a.amtMin ?? null) === (b.amtMin ?? null) && (a.amtMax ?? null) === (b.amtMax ?? null);
}
async function mergeDupRules() {
  if (S.mergingRules) return; const groups = [];
  ruleList().forEach((r) => { const g = groups.find((x) => sameRuleTarget(x[0], r)); if (g) g.push(r); else groups.push([r]); });
  const dups = groups.filter((g) => g.length > 1); if (!dups.length) return;
  S.mergingRules = true;
  try {
    const b = writeBatch(db);
    dups.forEach(([keep, ...rest]) => {
      b.update(doc(db, 'rules', keep.id), { keywords: [...new Set([keep, ...rest].flatMap((r) => r.keywords || []))] });
      rest.forEach((r) => b.delete(doc(db, 'rules', r.id)));
    });
    await b.commit();
  } catch (e) { console.error(e); } finally { S.mergingRules = false; }
}
function ruleList() { return Object.values(S.rules).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)); }
// Amount condition (size only, sign ignored): exactly X, or between min and max (inclusive)
function amountOk(r, t) {
  if (!r.amtMode || r.amtMode === 'any') return true;
  const v = Math.round(Math.abs(t.amount) * 100);
  if (r.amtMode === 'exact') return v === Math.round((r.amtMin || 0) * 100);
  return v >= Math.round((r.amtMin || 0) * 100) && v <= Math.round((r.amtMax || 0) * 100);
}
function amtText(r) {
  if (!r.amtMode || r.amtMode === 'any') return '';
  return r.amtMode === 'exact' ? `amount is $${fmt.format(r.amtMin || 0)}` : `amount $${fmt.format(r.amtMin || 0)}–$${fmt.format(r.amtMax || 0)}`;
}
function ruleMatches(r, t) {
  if (!amountOk(r, t)) return false;
  if (r.field === 'account') return t.accountId === r.accountId;
  if (r.accountId && t.accountId !== r.accountId) return false; // "Only in account"
  const hay = `${t.name || ''} ${t.merchant || ''} ${t.originalDescription || ''}`.toLowerCase(); // name, merchant and the full bank description
  return (r.keywords || []).some((k) => k && hay.includes(k));
}
function ruleUpdates(t) {
  // Rules only fill in records that are still uncategorized; a categorized (or transfer) record is never touched
  if (t.categoryId || t.isTransfer) return {};
  const upd = {}; let labels = null;
  for (const r of ruleList()) {
    if (!ruleMatches(r, t)) continue;
    if (r.categoryId && !t.categoryId && !upd.categoryId && S.cats[r.categoryId]) upd.categoryId = r.categoryId;
    if (r.labelId && S.labels[r.labelId] && !(t.labels || []).includes(r.labelId)) (labels ||= new Set(t.labels || [])).add(r.labelId);
    if (r.transfer && !t.isTransfer) upd.isTransfer = true;
  }
  if (labels) upd.labels = [...labels];
  return upd;
}
let rulesTimer;
function scheduleRules() { clearTimeout(rulesTimer); rulesTimer = setTimeout(() => applyRules(false), 800); }
async function applyRules(all) {
  if (S.applying || !S.rulesLoaded || !S.txLoaded || !ruleList().length) return 0;
  const cands = S.txs.filter((t) => !t.manual && !t.parentId && (all || !t.ruled));
  if (!cands.length) return 0;
  S.applying = true; let changed = 0;
  try {
    const ops = [];
    for (const t of cands) {
      const upd = ruleUpdates(t);
      if (Object.keys(upd).length) changed++;
      if (Object.keys(upd).length || !t.ruled) ops.push([t.id, { ...upd, ruled: true }]);
    }
    for (let i = 0; i < ops.length; i += 450) {
      const b = writeBatch(db); ops.slice(i, i + 450).forEach(([id, u]) => b.update(doc(db, 'transactions', id), u)); await b.commit();
    }
  } catch (e) { console.error(e); } finally { S.applying = false; }
  return changed;
}

// ---------- routing ----------
function route() {
  const [path, qs] = (location.hash.replace(/^#\/?/, '') || 'accounts').split('?');
  const parts = path.split('/');
  return { name: parts[0], id: parts[1], params: new URLSearchParams(qs || '') };
}
// ---- navigation that matches the page hierarchy (so iOS swipe-back goes to the logical previous page) ----
const NAV = [location.hash || '#/accounts'];
let navReplacing = false; let drawerOrigin = null;
function go(h, replace = false) {
  if ((location.hash || '#/accounts') === h) return;
  if (replace) { navReplacing = true; location.replace(h); } else location.hash = h;
}
// Go to a parent page: pop history if the parent is the previous entry, otherwise swap the current entry.
function goUp(h) { if (NAV.length > 1 && NAV[NAV.length - 2] === h) history.back(); else go(h, true); }
window.addEventListener('hashchange', () => {
  const h = location.hash || '#/accounts';
  let left = null;
  if (navReplacing) { NAV[NAV.length - 1] = h; navReplacing = false; }
  else if (NAV.length > 1 && NAV[NAV.length - 2] === h) left = NAV.pop();
  else NAV.push(h);
  closeSheet(); closeDrawer();
  window.scrollTo(0, 0); render();
  // Back from a page opened from the menu → show the menu again, like before
  if (left && left === drawerOrigin && MAIN.includes(route().name)) { drawerOrigin = null; openDrawer(); }
});
const MAIN = ['accounts', 'dash', 'tx'];
const SUB_TITLES = { cats: 'Categories', labels: 'Labels', filters: 'Filters', rules: 'Automatic Rules', conns: 'Accounts' };

// ---------- render ----------
function render() {
  if (!S.user) return;
  const r = route();
  const y = window.scrollY;
  const focusId = document.activeElement?.id; const caret = document.activeElement?.selectionStart;
  const views = { dash: viewDash, tx: () => viewTx(r.params), cats: viewCats, cat: () => viewCat(r.id), labels: viewLabels, filters: viewFilters, rules: viewRules, conns: viewConns, conn: () => viewConn(r.id) };
  const main = !views[r.name] || MAIN.includes(r.name);
  const body = (views[r.name] || viewAccounts)();
  $('app').innerHTML = (main ? headerMain(r.name) : headerSub(r)) + body
    + (r.name === 'tx' ? `<button class="fab" data-act="add-tx" aria-label="Add a record">${icon('add')}</button>` : '');
  window.scrollTo(0, y);
  if (focusId && $(focusId)) { const f = $(focusId); f.focus(); if (caret != null && f.setSelectionRange) f.setSelectionRange(caret, caret); }
}
function headerMain(active) {
  const cur = MAIN.includes(active) ? active : 'accounts';
  const tab = (key, label) => `<a href="#/${key}" data-act="tab"${cur === key ? ' aria-current="page"' : ''}>${label}</a>`;
  return `<header class="top"><div class="bar">
    <button class="icon-btn round" data-act="drawer" aria-label="Menu">${icon('menu')}</button>
    <h1>${APP_NAME}</h1>
    <button class="icon-btn round" data-act="sync" aria-label="Sync now">${icon('sync')}</button>
  </div><nav class="tabs">${tab('accounts', 'Accounts')}${tab('dash', 'Dashboard')}${tab('tx', 'Records')}</nav></header>`;
}
function headerSub(r) {
  let title = SUB_TITLES[r.name] || ''; let back = '#/accounts';
  if (r.name === 'cat') {
    const c = S.cats[r.id];
    title = c?.parentId ? 'Edit subcategory' : 'Edit category';
    back = c?.parentId ? `#/cat/${c.parentId}` : '#/cats';
  }

    (g[k] ||= { sum: 0, list: [] }); g[k].sum += b; g[k].list.push({ a, b });

}

// ---- Spending by category: donut + trend + top 5 (tap a slice to focus everything on it) ----
function spendingModel(spec, r) {
  const ok = specMatcher(spec);
  const all = S.txs.filter((t) => t.date >= r[0] && t.date <= r[1] && !t.isTransfer && sideOf(t) === 'expense' && ok(t));
  const drill = S.donutDrill && S.cats[S.donutDrill] ? S.cats[S.donutDrill] : null;
  const groupKey = (t) => {
    const c = S.cats[t.categoryId]; const top = topOf(c);
    if (!drill) return top ? top.id : 'unknown';
    if (!top || top.id !== drill.id) return null;
    return lvl2Of(c)?.id || '_self';
  };
  const groups = {};
  all.forEach((t) => { const k = groupKey(t); if (k === null) return; (groups[k] ||= []).push(t); });
  const segs = Object.entries(groups).map(([k, txs]) => {
    const c = drill ? (k === '_self' ? drill : S.cats[k]) : (k === 'unknown' ? null : S.cats[k]);
    const name = drill ? (k === '_self' ? `General – ${drill.name}` : (c?.name || 'Deleted')) : (c ? c.name : 'Uncategorized');
    const hasSubs = !drill && !!c && txs.some((t) => S.cats[t.categoryId]?.parentId);
    return { id: k, name, value: txs.reduce((a, t) => a + t.amount, 0), color: c ? catColor(c) : '#C7C7CC', cat: c, txs, hasSubs };
  }).filter((g) => g.value > 0.004).sort((a, b) => b.value - a.value);
  if (drill) segs.forEach((g, i) => { g.color = shade(drill.color || '#8E8E93', i, segs.length); });
  const sel = segs.find((g) => g.id === S.donutSel) || null;
  const focus = sel ? sel.txs : segs.flatMap((g) => g.txs);
  const focusColor = sel ? sel.color : drill ? (drill.color || '#3478F6') : '#3478F6';
  return { all, drill, segs, sel, focus, focusColor, total: segs.reduce((n, g) => n + g.value, 0) };
}
function barChart(bs, values, color, opts = {}) {

  const parts = bs.map((b, i) => {

// ---- Cash flow trend ----
function buckets([from, to]) {
  const f = parseYmd(from); const t = parseYmd(to);
  const days = Math.round((t - f) / 86400000) + 1;
  const out = [];
  if (days <= 31) {
    for (let d = new Date(f); d <= t; d = addDays(d, 1)) out.push({ kind: 'day', from: ymd(d), to: ymd(d), label: `${d.getMonth() + 1}/${d.getDate()}`, tick: String(d.getDate()) });
  } else if (days <= 120) {
    for (let d = new Date(f); d <= t; d = addDays(d, 7)) { const e = addDays(d, 6) > t ? t : addDays(d, 6); out.push({ kind: 'week', from: ymd(d), to: ymd(e), label: `${d.getMonth() + 1}/${d.getDate()}`, tick: `${d.getMonth() + 1}/${d.getDate()}` }); }
  } else {
    for (let d = new Date(f.getFullYear(), f.getMonth(), 1); d <= t; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
      const e = new Date(d.getFullYear(), d.getMonth() + 1, 0);
      const mo = d.toLocaleDateString('en-US', { month: 'short' });
      out.push({ kind: 'month', from: ymd(d < f ? f : d), to: ymd(e > t ? t : e), label: `${mo} ${d.getFullYear()}`, tick: d.getMonth() === 0 && f.getMonth() !== 0 ? `${mo} '${String(d.getFullYear()).slice(2)}` : mo });
    }
  }
  return out;
}
function niceTicks(lo, hi, count = 4) {
  const span = hi - lo || 1; const raw = span / count; const mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((x) => x >= raw) || raw;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(Math.round(v * 100) / 100);
  return out;
}
function kfmt(v) { const a = Math.abs(v); const s = a >= 1000 ? `${+(a / 1000).toFixed(a >= 10000 ? 0 : 1)}k` : `${Math.round(a)}`; return (v < 0 ? '-' : '') + s; }
function smoothPath(pts) {
  if (pts.length < 2) return '';

  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i]; const p1 = pts[i]; const p2 = pts[i + 1]; const p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
function cardTrend() {
  const spec = cardSpec('trend').spec; const ok = specMatcher(spec);
  const bs = buckets(rangeOf(getPeriod('trend'))).map((b) => ({ ...b, inc: 0, exp: 0 }));
  const idx = (date) => { let lo = 0; let hi = bs.length - 1; while (lo <= hi) { const m = (lo + hi) >> 1; if (date < bs[m].from) hi = m - 1; else if (date > bs[m].to) lo = m + 1; else return m; } return -1; };
  for (const t of S.txs) {
    if (t.isTransfer || !ok(t)) continue;
    const i = idx(t.date); if (i < 0) continue;
    if (sideOf(t) === 'income') bs[i].inc += -t.amount; else bs[i].exp += t.amount;
  }
  const cum = S.trendMode === 'cumulative';
  const net = bs.map((b) => b.inc - b.exp);
  let run = 0; const cumNet = net.map((v) => (run += v));
  const line = cum ? cumNet : net;

  // left axis: bars (and the net line in Trend mode)
  let hiL = Math.max(0, ...bs.map((b) => b.inc)); let loL = Math.min(0, ...bs.map((b) => -b.exp));
  if (!cum) { hiL = Math.max(hiL, ...net); loL = Math.min(loL, ...net); }

  // right axis: cumulative line
  let hiR = Math.max(0, ...cumNet); let loR = Math.min(0, ...cumNet); if (hiR === loR) hiR = loR + 1;
  const tR = niceTicks(loR, hiR); hiR = Math.max(hiR, tR[tR.length - 1]); loR = Math.min(loR, tR[0]);
  const W = 340; const H = 210; const top = 8; const bot = 176; const x0 = 34; const x1 = cum ? W - 34 : W - 6;
  const yL = (v) => top + ((hiL - v) / (hiL - loL)) * (bot - top);
  const yR = (v) => top + ((hiR - v) / (hiR - loR)) * (bot - top);
  const slot = (x1 - x0) / Math.max(n, 1); const bw = Math.max(2, Math.min(18, slot * 0.72));
  const cx = (i) => x0 + slot * i + slot / 2;
  const bars = bs.map((b, i) => {
    const x = (cx(i) - bw / 2).toFixed(1);
    return `<rect x="${x}" y="${top}" width="${bw.toFixed(1)}" height="${bot - top}" rx="2" fill="var(--line)"></rect>
      ${b.inc > 0 ? `<rect x="${x}" y="${yL(b.inc).toFixed(1)}" width="${bw.toFixed(1)}" height="${(yL(0) - yL(b.inc)).toFixed(1)}" fill="var(--inc)"><title>${b.label} income ${money(b.inc)}</title></rect>` : ''}
      ${b.exp > 0 ? `<rect x="${x}" y="${yL(0).toFixed(1)}" width="${bw.toFixed(1)}" height="${(yL(-b.exp) - yL(0)).toFixed(1)}" fill="var(--exp)"><title>${b.label} expenses ${money(b.exp)}</title></rect>` : ''}`;
  }).join('');
  const pts = line.map((v, i) => [cx(i), cum ? yR(v) : yL(v)]);
  const every = n > 31 ? Math.ceil(n / 31) : 1; const fs = n > 20 ? 7.5 : n > 12 ? 9 : 10;
  const xl = bs.map((b, i) => i % every === 0 ? `<text x="${cx(i).toFixed(1)}" y="${H - 16}" text-anchor="middle" font-size="${fs}" fill="var(--sub)">${b.tick}</text>` : '').join('');
  const axL = tL.map((v) => `<text x="${x0 - 5}" y="${(yL(v) + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--sub)">${kfmt(v)}</text>`).join('');
  const axR = cum ? tR.map((v) => `<text x="${x1 + 5}" y="${(yR(v) + 3).toFixed(1)}" font-size="9" fill="var(--sub)">${kfmt(v)}</text>`).join('') : '';
  const total = cum ? (cumNet[n - 1] || 0) : net.reduce((a, v) => a + v, 0);

    <div class="row-between"><div class="big num" style="font-size:26px">${money(total, true)}</div>
      <div class="seg"><button data-act="trend-mode" data-mode="trend" aria-pressed="${!cum}">Trend</button><button data-act="trend-mode" data-mode="cumulative" aria-pressed="${cum}">Cumulative</button></div></div>
    <svg viewBox="0 0 ${W} ${H}" class="trend" role="img" aria-label="Income, expenses and ${cum ? 'cumulative' : ''} cash flow over time">
      ${bars}<line x1="${x0}" x2="${x1}" y1="${yL(0).toFixed(1)}" y2="${yL(0).toFixed(1)}" stroke="var(--sub)" stroke-width=".6" opacity=".5"></line>

    <div class="legend-inline" style="justify-content:center"><span><i class="ln"></i>${cum ? 'Cumulative cash flow (right axis)' : 'Net cash flow'}</span><span><i style="background:var(--inc)"></i>Income</span><span><i style="background:var(--exp)"></i>Expenses</span></div>
  </section>`;

  if (kind === 'year') return [ymd(new Date(y, 0, 1)), ymd(new Date(y, 11, 31))];
  if (kind === 'last_year') return [ymd(new Date(y - 1, 0, 1)), ymd(new Date(y - 1, 11, 31))];

  else if (p.unit === 'month') { nf = new Date(f.getFullYear(), f.getMonth() + dir, 1); nt = new Date(f.getFullYear(), f.getMonth() + dir + 1, 0); }
  else if (p.unit === '6m') { nf = new Date(f.getFullYear(), f.getMonth() + 6 * dir, f.getDate()); nt = new Date(t.getFullYear(), t.getMonth() + 6 * dir, t.getDate()); }

  else { const days = Math.round((t - f) / 86400000) + 1; nf = addDays(f, days * dir); nt = addDays(t, days * dir); }

function pickerBody(q) {
  const t = S.txById[S.picker.txId];
  const sel = S.picker.mode === 'edit' ? S.edit.categoryId : S.picker.mode === 'rule' ? S.ruleDraft.categoryId : S.picker.mode === 'split' ? S.split.parts[S.picker.i].categoryId : t?.categoryId;
  const vt = visibleTops();
  const pickBtn = (c, sub = false) => `<button class="pick${sub === 'sub2' ? ' sub sub2' : sub ? ' sub' : ''}" data-act="pick-cat" data-id="${c.id}" aria-pressed="${sel === c.id}">${catIcon(c)}<span class="n">${esc(c.name)}</span></button>`;
  if (q) {
    const all = vt.flatMap((c) => [c, ...descendants(c.id).map((d) => S.cats[d]).filter((x) => x && !x.hidden)]);
    const hits = all.filter((c) => c.name.toLowerCase().includes(q));
    return hits.map((c) => `<button class="pick" data-act="pick-cat" data-id="${c.id}" aria-pressed="${sel === c.id}">${catIcon(c)}<span class="n">${esc(c.name)}${c.parentId ? `<span class="meta"> · ${esc(S.cats[c.parentId]?.name || '')}</span>` : ''}</span></button>`).join('') || '<div class="meta">No matching categories</div>';
  }
  const ids = new Set(vt.flatMap((c) => [c.id, ...descendants(c.id).filter((d) => !S.cats[d]?.hidden)]));
  const counts = {};
  S.txs.forEach((x) => { if (ids.has(x.categoryId)) counts[x.categoryId] = (counts[x.categoryId] || 0) + 1; });
  const freq = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 8).map((id) => S.cats[id]);
  const freqHtml = freq.length ? `<div class="sec-head">Most frequent</div><div class="freq">${freq.map((c) => `<button data-act="pick-cat" data-id="${c.id}" aria-pressed="${sel === c.id}">${catIcon(c)}<span>${esc(c.name)}</span></button>`).join('')}</div>` : '';
  const list = vt.map((c) => {
    const subs = subsOf(c.id).filter((x) => !x.hidden);
    if (!subs.length) return pickBtn(c);
    const open = S.pickOpen.has(c.id);
    return `<button class="pick${open ? ' open' : ''}" data-act="pick-open" data-id="${c.id}" aria-expanded="${open}">${catIcon(c)}<span class="n">${esc(c.name)}</span><span class="ms chev" aria-hidden="true">expand_more</span></button>
      ${open ? `<button class="pick sub" data-act="pick-cat" data-id="${c.id}" aria-pressed="${sel === c.id}">${catIcon(c)}<span class="n">${esc(c.name)} <span class="meta">(general)</span></span></button>${subs.map((x) => pickBtn(x, true) + subsOf(x.id).filter((y) => !y.hidden).map((y) => pickBtn(y, 'sub2')).join('')).join('')}` : ''}`;
  }).join('');

// Keyword ideas from a bank record: its first word, and the whole name without trailing store numbers
function kwSuggest(t) {
  const out = kwSuggestFrom(t.merchant || t.name);
  if (t.originalDescription) kwSuggestFrom(t.originalDescription).forEach((k) => { if (!out.includes(k)) out.push(k); });
  return out.slice(0, 5);
}
function kwSuggestFrom(text) {
  const raw = String(text || '').toLowerCase().replace(/\s+/g, ' ').trim();
  const full = raw.replace(/\s*[#*]?\s*\d{3,}.*$/, '').trim();
  // Card processors put a short code before "*" (TST*, SQ *, WEIXIN*): suggest the name after it first
  const core = full.replace(/^[a-z0-9]{1,8}\s*\*\s*/, '').trim() || full;
  const first = (core.match(/[a-z0-9\u4e00-\u9fff&']+/) || [''])[0];
  const pre = (full.match(/^([a-z0-9]{2,8})\s*\*/) || [])[1]; // payment prefix like "alp*" (Alipay), "sq*", "tst*"
  return [...new Set([first.length >= 3 ? first : core, core, full, pre && pre + '*'].filter(Boolean))];
}

  if (d.field === 'account' && !data.accountId) { toast('Choose an account'); return; }
  if (!data.categoryId && !data.labelId && !data.transfer) { toast('Choose at least one action'); return; }

async function addDemo() {
  // Wait until records and categories are loaded, otherwise existing demo records could be overwritten
  if (!S.txLoaded || !S.catsLoaded) { toast('Still loading, try again in a moment'); return; }
  if (S.raw.some((t) => t.demo || String(t.id).startsWith('demo_'))) { toast('Demo data is already there'); return; }
  const findCat = (top, sub) => {
    const t = tops().find((c) => c.name === top); if (!t) return null;
    if (!sub) return t.id;
    return subsOf(t.id).find((c) => c.name === sub)?.id || t.id;
  };
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const b = writeBatch(db);
  DEMO_ACCOUNTS.forEach((a) => b.set(doc(db, 'accounts', a.id), { ...a, demo: true }));
  let n = 0;
  DEMO_TX.forEach(([merchant, top, sub, min, max, count, acc, transfer]) => {
    for (let i = 0; i < count; i++) {
      const amt = Math.round((min + rnd() * (max - min)) * 100) / 100;
      const date = ymd(addDays(new Date(), -Math.floor(rnd() * 75)));
      const id = `demo_${n++}`; if (S.rawById[id]) continue; // never overwrite an existing record
      b.set(doc(db, 'transactions', id), {
        accountId: acc, itemId: null, date, name: merchant, merchant, amount: amt, currency: 'USD', pending: false,
        categoryId: top ? findCat(top, sub) : null, labels: [], isTransfer: !!transfer, demo: true, createdAt: serverTimestamp(),
      });
    }
  });
  await b.commit();
  toast(`Added ${n} demo records`);
}

async function doSync(itemId, again = false) {
  const refresh = !again && Date.now() - (S.lastRefresh || 0) > 60000; // Plaid allows 2 refreshes a minute per bank
  if (refresh) S.lastRefresh = Date.now();
  toast(refresh ? 'Asking your banks for new data… (about 30 s)' : 'Syncing…', 90000);
  try {
    const { data } = await call('syncNow')({ ...(itemId ? { itemId } : {}), refresh });
    if (data.refreshed && !again) setTimeout(() => doSync(itemId, true), 120000); // banks can be slow: pick up late arrivals quietly
    const errs = data.results.filter((r) => r.error);
    const added = data.results.reduce((n, r) => n + (r.added || 0), 0);
    if (again && !added && !errs.length) return; // the quiet follow-up only speaks up when something new arrived
    toast(errs.length ? `${errs.length} bank(s) had sync errors. See the Accounts page.` : `Synced. ${added} new record${added === 1 ? '' : 's'}.`);
  } catch (e) { toast('Sync failed: ' + errMsg(e)); }
}

        [o[i], o[j]] = [o[j], o[i]];
        const y = document.querySelector('.sheet')?.scrollTop; renderAccReorder(); if (y) document.querySelector('.sheet').scrollTop = y; break;
      }
      case 'acc-order-save': {
        const b = writeBatch(db); S.accOrder.forEach((aid, i) => b.update(doc(db, 'accounts', aid), { order: i, ...(S.accounts[aid]?.color ? {} : { color: S.accColor[aid] }) }));
        await b.commit(); closeSheet(); toast('Order saved'); break;
      }
      case 'cat-move': {
        const o = S.catOrder.ids; const i = +el.dataset.i; const j = i + Number(el.dataset.dir);
        if (j < 0 || j >= o.length) break;
        [o[i], o[j]] = [o[j], o[i]];
        const y = document.querySelector('.sheet')?.scrollTop; renderCatReorder(); if (y) document.querySelector('.sheet').scrollTop = y; break;
      }
      case 'cat-order-save': {
        const b = writeBatch(db); S.catOrder.ids.forEach((cid, i) => b.update(doc(db, 'categories', cid), { order: i }));
        await b.commit(); closeSheet(); toast('Order saved'); break;
      }
      case 'do-update': location.replace(`${location.pathname}?v=${encodeURIComponent(el.dataset.v)}${location.hash}`); break;
      case 'check-update': closeDrawer(); await checkUpdate(true); break;
      case 'card-move': {
        const o = cardOrder(); const i = o.indexOf(el.dataset.card); const j = i + Number(el.dataset.dir);
        if (j < 0 || j >= o.length) break;
        [o[i], o[j]] = [o[j], o[i]]; localStorage.setItem('cardOrder', JSON.stringify(o));
        const y = document.querySelector('.sheet')?.scrollTop; sheetReorder(); if (y) document.querySelector('.sheet').scrollTop = y; render(); break;
      }
      case 'show-more': sheetShowMore(); break;
      case 'row-rec': openRowRecords(el.dataset.side, el.dataset.scope, el.dataset.title); break;
      case 'rec-sort': openOptions('Sort by', Object.entries(SORTS).map(([k, l]) => ({ value: k, label: l, iconHtml: glyph(k.startsWith('date') ? 'calendar_today' : 'attach_money', '#3478F6') })), S.recPop.sort, (v) => { S.recPop.sort = v; sheetRecords(); }); break;
      case 'donut-sel': S.donutSel = S.donutSel === id ? null : id; render(); break;
      case 'bar-sel': S.barSel = S.barSel === id ? null : id; render(); break;
      case 'donut-drill': S.donutDrill = id; S.donutSel = null; render(); break;
      case 'donut-back': S.donutDrill = null; S.donutSel = null; render(); break;
      case 'trend-mode': S.trendMode = el.dataset.mode; render(); break;
      case 'toggle': { const k = el.dataset.key; S.expanded.has(k) ? S.expanded.delete(k) : S.expanded.add(k); render(); break; }
      case 'go-unknown': location.hash = '#/tx?f=unknown'; break;
      case 'go-cat-tx': location.hash = `#/tx?cat=${el.dataset.key}`; break;
      case 'txf': S.txFilter = el.dataset.f; go(`#/tx?f=${el.dataset.f}`, true); break;
      case 'load-all': setLoadAll(!S.loadAll); break;
      case 'rec-shift': shiftRec(Number(el.dataset.dir)); render(); break;
      case 'rec-kind': openOptions('Period', Object.entries(REC_KINDS).map(([k, l]) => ({ value: k, label: l, iconHtml: glyph(k === 'custom' ? 'date_range' : k === 'all' ? 'all_inclusive' : 'calendar_month', '#3478F6') })), (() => { const p = recPeriod(); if (p.kind !== 'shifted') return p.kind; const k = Object.keys(REC_KINDS).find((x) => x !== 'all' && x !== 'custom' && recPresetRange(x)[0] === p.from && recPresetRange(x)[1] === p.to); return k || ''; })(), (v) => {
        if (v === 'custom') { sheetRecCustom(); return; }
        setRecKind(v); if (v === 'all') setLoadAll(true); closeSheet(); render();
      }); break;
      case 'rec-custom-save': {
        const from = $('rc-from').value; const to = $('rc-to').value;
        if (!from || !to || from > to) { toast('Choose a valid start and end date'); return; }
        S.recP = { kind: 'custom', unit: 'custom', from, to }; if (from < loadedSince()) setLoadAll(true); closeSheet(); render(); break;
      }
      case 'rec-panel': sheetRecPanel(); break;
      case 'rf-acc': sheetRecAccounts(); break;
      case 'rf-cat': sheetRecCats(); break;
      case 'rf-filter': openOptions('Saved filter', [{ value: '', label: 'None', iconHtml: glyph('block', '#C7C7CC') }, ...Object.values(S.filters).sort((a, b) => a.name.localeCompare(b.name)).map((x) => ({ value: x.id, label: x.name, sub: specName(x), iconHtml: glyph('filter_alt', '#AF52DE') }))], recFilterState().filter, (v) => { recFilterState().filter = v; sheetRecPanel(); render(); }); break;
      case 'rf-acc-save': {
        const ids = [...document.querySelectorAll('[data-accsel]:checked')].map((x) => x.dataset.accsel);
        recFilterState().accounts = $('acc-all').checked || !ids.length ? null : ids; sheetRecPanel(); render(); break;
      }
      case 'rf-cat-save': {
        const ids = mselIds();
        const lb = [...S.msel].filter((k) => k.startsWith('l:') && S.labels[k.slice(2)]).map((k) => k.slice(2));
        const r = recFilterState(); r.cats = ids.length ? ids : null; r.labels = lb.length ? lb : null; sheetRecPanel(); render(); break;
      }
      case 'rf-reset': S.rf = null; sheetRecPanel(); render(); break;
      case 'tx': S.back = el.dataset.back || null; openEdit(id); break;
      case 'tx-cat': S.back = el.dataset.back || null; openPicker({ mode: 'direct', txId: id }); break;
      case 'pick-open': S.pickOpen.has(id) ? S.pickOpen.delete(id) : S.pickOpen.add(id); $('catpick').innerHTML = pickerBody(($('catq')?.value || '').trim().toLowerCase()); break;
      case 'pick-cat': {
        const p = S.picker;
        if (p?.mode === 'edit') { S.edit.categoryId = id || null; renderEdit(); break; }
        if (p?.mode === 'rule') { S.ruleDraft.categoryId = id || null; renderRule(); break; }
        if (p?.mode === 'split') { const pt = S.split.parts[p.i]; pt.categoryId = id || null; pt.isTransfer = false; renderSplit(); break; }
        if ($('same-merchant')) S.sameMerchant = $('same-merchant').checked;
        closeSheet(); await setTxCategory(p.txId, id, S.sameMerchant); backToPopup(); break;
      }
      case 'edit-cat': captureEdit(); openPicker({ mode: 'edit', txId: S.edit.txId }); break;
      case 'edit-type': captureEdit(); S.edit.type = el.dataset.type; renderEdit(); break;
      case 'save-edit': await saveEdit(); break;
      case 'search-clear': S.search = ''; clearTimeout(searchTimer); render(); break;
      case 'ed-split': { captureEdit(); const et = S.txById[S.edit.txId]; if (et?.parentId) openSplit(et.parentId); else openSplit(S.edit.txId, S.edit); if (S.split) { S.split.fromEdit = true; S.sheetBack = renderEdit; } break; }
      case 'sp-mode': spCapture(); S.split.mode = el.dataset.mode; renderSplit(); break;
      case 'sp-cat': spCapture(); openPicker({ mode: 'split', i: +el.dataset.i }); break;
      case 'sp-add': spCapture(); S.split.parts.push(newPart()); renderSplit(); break;
      case 'sp-del': spCapture(); if (S.split.parts.length < 2) { toast('Keep at least one part'); break; } S.split.parts.splice(+el.dataset.i, 1); renderSplit(); if (S.split.parts.length === 1) toast('Save to undo the split'); break;
      case 'sp-save': await saveSplit(); break;
      case 'sp-remove': await removeSplit(); break;
      case 'ed-acc': captureEdit(); openOptions('Account', accountOptionList(), S.edit.accountId, (v) => { S.edit.accountId = v; renderEdit(); }); break;
      case 'ru-field': captureRule(); openOptions('Match by', [{ value: 'description', label: 'Description contains', iconHtml: glyph('text_fields', '#3478F6') }, { value: 'account', label: 'Account is', iconHtml: glyph('credit_card', '#3478F6') }], S.ruleDraft.field, (v) => { S.ruleDraft.field = v; renderRule(); }); break;
      case 'ru-acc': captureRule(); openOptions('Account', accountOptionList().filter((o) => o.value !== 'cash' || S.accounts.cash), S.ruleDraft.accountId, (v) => { S.ruleDraft.accountId = v; renderRule(); }); break;
      case 'ru-cat': captureRule(); openPicker({ mode: 'rule' }); break;
      case 'rule-fold': { const f = S.ruleFold ||= new Set(); f.has(id) ? f.delete(id) : f.add(id); render(); break; }
      case 'ru-amt': captureRule(); openOptions('Amount', [{ value: 'any', label: 'Any amount' }, { value: 'exact', label: 'Exactly' }, { value: 'range', label: 'Between' }].map((o) => ({ ...o, iconHtml: glyph('attach_money', '#34C759') })), S.ruleDraft.amtMode || 'any', (v) => { S.ruleDraft.amtMode = v; renderRule(); }); break;
      case 'ru-only': captureRule(); openOptions('Only in account', [{ value: '', label: 'Any account', iconHtml: glyph('all_inclusive', '#8E8E93') }, ...accountOptionList().filter((o) => o.value !== 'cash' || S.accounts.cash)], S.ruleDraft.onlyAcc || '', (v) => { S.ruleDraft.onlyAcc = v || null; renderRule(); }); break;
      case 'ru-sug': captureRule(); S.ruleDraft.kw = [...new Set([...S.ruleDraft.kw, el.dataset.v])]; renderRule(); break;
      case 'ru-kw-add': captureRule(); S.ruleDraft.kw = allKw(S.ruleDraft); S.ruleDraft.kwInput = ''; renderRule(); break;
      case 'ru-kw-del': captureRule(); S.ruleDraft.kw.splice(+el.dataset.i, 1); renderRule(); break;
      case 'ed-rule': captureEdit(); sheetRuleFromTx(S.edit.txId, S.edit); break;
      case 'ru-lbl': captureRule(); openOptions('Label', labelOptionList('No label'), S.ruleDraft.labelId || '', (v) => { S.ruleDraft.labelId = v || null; renderRule(); }); break;
      case 'pick-color':
        sheet.dataset.color = el.dataset.color;
        sheet.querySelectorAll('[data-act="pick-color"]').forEach((b) => b.setAttribute('aria-pressed', b === el));
        if ($('lbl-prev')) $('lbl-prev').innerHTML = labelPill({ name: $('nm').value || 'Label', color: el.dataset.color });
        break;
      case 'pick-icon':
        sheet.dataset.icon = el.dataset.icon;
        sheet.querySelectorAll('[data-act="pick-icon"]').forEach((b) => b.setAttribute('aria-pressed', b === el));
        break;
      case 'card-scope': { const c = el.dataset.card; if (el.dataset.v === 'all') localStorage.removeItem('scope:' + c); else localStorage.setItem('scope:' + c, el.dataset.v); S.barSel = c === 'structure' ? null : S.barSel; render(); break; }
      case 'nw-zero': { const z = S.nwZero ||= new Set(); z.has(id) ? z.delete(id) : z.add(id); render(); break; }
      case 'nw-fold': { const o = S.nwOpen ||= new Set(); o.has(id) ? o.delete(id) : o.add(id); render(); break; }
      case 'save-acc': {
        const name = $('an').value.trim();
        const inv = $('ainv').checked; const acc = S.accounts[id];
        await updateDoc(doc(db, 'accounts', id), { customName: name || deleteField(), color: sheet.dataset.color || deleteField(), hidden: $('ah').checked,
          investment: inv === (acc?.type === 'investment') ? deleteField() : inv, // store only when it differs from what the bank says
          business: $('abiz').checked === isBusiness({ ...acc, business: undefined }) ? deleteField() : $('abiz').checked });
        closeSheet(); toast('Saved'); break;
      }
      case 'edit-icon': sheetIcon(id); break;
      case 'save-icon': {
        const upd = { icon: sheet.dataset.icon };
        if (!S.cats[id].parentId && sheet.dataset.color) upd.color = sheet.dataset.color;
        await updateDoc(doc(db, 'categories', id), upd); closeSheet(); break;
      }
      case 'rename': sheetName('Rename', S.cats[id].name, 'save-name', id); break;
      case 'save-name': { const name = $('nm').value.trim(); if (!name) { toast('Name can’t be empty'); return; } await updateDoc(doc(db, 'categories', id), { name }); closeSheet(); break; }
      case 'add-sub': sheetName('New subcategory', '', 'save-sub', id); break;
      case 'save-sub': { const name = $('nm').value.trim(); if (!name) { toast('Name can’t be empty'); return; } await addCategory(name, id); closeSheet(); break; }
      case 'add-cat': sheetName('New category', '', 'save-top', ''); break;
      case 'save-top': { const name = $('nm').value.trim(); if (!name) { toast('Name can’t be empty'); return; } const nid = await addCategory(name, null); closeSheet(); location.hash = `#/cat/${nid}`; break; }
      case 'del-cat': await deleteCategory(id); break;
      case 'cat-type': await updateDoc(doc(db, 'categories', id), { type: el.dataset.type }); break;
      case 'add-tx': openNew(); break;
      case 'toggle-label': {
        const on = el.getAttribute('aria-pressed') !== 'true';
        el.setAttribute('aria-pressed', on);
        if (el.dataset.tx) await updateDoc(doc(db, 'transactions', el.dataset.tx), { labels: on ? arrayUnion(id) : arrayRemove(id) });
        break;
      }
      case 'new-label': {
        const l = await newLabel(); if (!l) break;
        const tx = el.dataset.tx;
        if (tx) await updateDoc(doc(db, 'transactions', tx), { labels: arrayUnion(l.id) });
        const chipEl = document.createElement('button');
        chipEl.className = 'chip'; chipEl.dataset.act = 'toggle-label'; chipEl.dataset.id = l.id; chipEl.dataset.tx = tx || '';
        chipEl.setAttribute('aria-pressed', 'true'); chipEl.textContent = l.name;
        el.before(chipEl);
        break;
      }
      case 'del-tx': if (!S.rawById[id]?.manual) break; if (!confirm('Delete this record?')) break; await deleteDoc(doc(db, 'transactions', id)); closeSheet(); toast('Deleted'); break;
      case 'add-label': sheetLabel(null); break;
      case 'edit-label': sheetLabel(id); break;
      case 'save-label': {
        const name = $('nm').value.trim(); if (!name) { toast('Name can’t be empty'); return; }
        const color = sheet.dataset.color || LABEL_COLORS[0];
        if (id) await updateDoc(doc(db, 'labels', id), { name, color }); else await setDoc(doc(collection(db, 'labels')), { name, color, createdAt: serverTimestamp() });
        closeSheet(); break;
      }
      case 'del-label': await deleteLabel(id); break;
      case 'add-filter': sheetFilter(null); break;
      case 'edit-filter': sheetFilter(id); break;
      case 'save-filter': {
        const name = $('fl-name').value.trim(); if (!name) { toast('Give the filter a name'); return; }
        const spec = mselSpec(); if (specEmpty(spec)) { toast('Pick at least one account, category or label'); return; }
        if (id) await updateDoc(doc(db, 'filters', id), { name, ...spec }); else await setDoc(doc(collection(db, 'filters')), { name, ...spec });
        closeSheet(); toast('Filter saved'); break;
      }
      case 'del-filter': {
        if (!confirm('Delete this filter?')) break;
        await deleteDoc(doc(db, 'filters', id));
        ['cashflow', 'detail', 'structure', 'trend'].forEach((c) => { if (savedFilterId(c) === id) localStorage.removeItem('filter:' + c); });
        closeSheet(); toast('Filter deleted'); break;
      }
      case 'add-rule': sheetRule(null); break;
      case 'edit-rule': sheetRule(id); break;
      case 'save-rule': await saveRule(); break;
      case 'del-rule': if (!confirm('Delete this rule?')) break; await deleteDoc(doc(db, 'rules', id)); closeSheet(); toast('Rule deleted'); break;
      case 'run-rules': { toast('Applying rules…'); const n = await applyRules(true); toast(n ? `Updated ${n} record${n === 1 ? '' : 's'}` : 'No records needed changes'); break; }
      default: break;
    }
  } catch (err) { console.error(err); toast('Something went wrong: ' + errMsg(err)); }
});

let searchTimer;
document.addEventListener('input', (e) => {
  if (e.target.id === 'nm' && $('lbl-prev')) { $('lbl-prev').innerHTML = labelPill({ name: e.target.value || 'Label', color: $('sheet').dataset.color }); return; }
  if (e.target.id === 'ed-amt') { e.target.style.width = `${Math.max(4, e.target.value.length) + 0.5}ch`; return; }
  if (e.target.classList.contains('sp-in')) { spCapture(); spRefresh(); return; }
  if ((e.target.id === 'ru-amt-a' || e.target.id === 'ru-amt-b') && S.ruleDraft) { captureRule(); refreshRuleCounts(); return; }
  if (e.target.id === 'ru-kw' && S.ruleDraft) { S.ruleDraft.kwInput = e.target.value; refreshRuleCounts(); return; }
  if (e.target.id === 'catq') { $('catpick').innerHTML = pickerBody(e.target.value.trim().toLowerCase()); return; }
  if (e.target.id !== 'txsearch') return;
  S.search = e.target.value;
  clearTimeout(searchTimer); searchTimer = setTimeout(render, 150);
});
document.addEventListener('change', async (e) => {
  if (e.target.dataset.connPause) { const on = e.target.checked; await updateDoc(doc(db, 'items', e.target.dataset.connPause), { paused: on }); toast(on ? 'Syncing paused' : 'Syncing resumed'); return; }
  if (e.target.dataset.spTransfer != null) { spCapture(); S.split.parts[+e.target.dataset.spTransfer].isTransfer = e.target.checked; renderSplit(); return; }
  const el = e.target;
  if (el.dataset.cardShow) {
    const h = cardHidden(); el.checked ? h.delete(el.dataset.cardShow) : h.add(el.dataset.cardShow);
    localStorage.setItem('cardHidden', JSON.stringify([...h])); render(); return;
  }
  if (el.id === 'acc-all' && el.checked) { document.querySelectorAll('[data-accsel]').forEach((x) => { x.checked = false; }); return; }
  if (el.dataset.accsel && el.checked && $('acc-all')) { $('acc-all').checked = false; return; }
  if (el.dataset.msel) {
    if (el.dataset.msel.startsWith('c:')) { mselToggle(el.dataset.msel, el.checked); const box = $('msel'); if (box) box.innerHTML = mselBody(); }
    else { el.checked ? S.msel.add(el.dataset.msel) : S.msel.delete(el.dataset.msel); if (el.dataset.msel.startsWith('a:')) { const v = document.querySelector('.msel-fold .v'); if (v) { const n = [...S.msel].filter((k) => k.startsWith('a:')).length; v.textContent = n ? `${n} selected` : 'All accounts'; } } }
    return;
  }
  try {
    if (el.dataset.act === 'cat-show') await updateDoc(doc(db, 'categories', el.dataset.id), { hidden: !el.checked });
  } catch (err) { toast('Could not save: ' + errMsg(err)); }
});

// ---------- keep bottom sheets above the on-screen keyboard ----------
// Works with any keyboard: we measure how much of the screen the keyboard covers and lift the sheet by that much.
function fitKeyboard() {
  const vv = window.visualViewport; if (!vv) return;
  const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  document.documentElement.style.setProperty('--kb', `${Math.round(kb)}px`);
  document.documentElement.style.setProperty('--vvh', `${Math.round(vv.height)}px`);
}
if (window.visualViewport) { visualViewport.addEventListener('resize', fitKeyboard); visualViewport.addEventListener('scroll', fitKeyboard); fitKeyboard(); }
document.addEventListener('focusin', (e) => {
  if (!e.target.closest?.('.sheet') || !e.target.matches('input, textarea')) return;
  setTimeout(() => { fitKeyboard(); e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 300);
});

// ---------- update check ----------
// Looks for a newer index.html (bypassing caches) and offers a one-tap reload.
async function checkUpdate(manual) {
  try {
    const res = await fetch(`${location.pathname}?check=${Date.now()}`, { cache: 'no-store' });
    const m = (await res.text()).match(/APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) {
      $('update').innerHTML = `<button class="update-bar" data-act="do-update" data-v="${esc(m[1])}">${icon('system_update')}Version ${esc(m[1])} is available · Tap to update</button>`;
    } else if (manual) toast(`You are on the latest version (${APP_VERSION})`);
  } catch { if (manual) toast('Could not check for updates'); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(false); });
checkUpdate(false);

// ---------- login ----------
function viewLogin() {
  S.unsub.forEach((u) => u()); S.unsub = [];
  if (S.txUnsub) { S.txUnsub(); S.txUnsub = null; }
  S.loadAll = false; S.instant = {};
  $('app').innerHTML = `<div class="login-wrap"><div class="login-brand">
      <img src="icon-192.png" alt="" width="84" height="84" class="login-logo">
      <h1>${APP_NAME}</h1><p>Every card, one place.</p></div>
    <form class="login" id="lf">
      <div class="field"><label for="em">Email</label><input class="input" id="em" type="email" autocomplete="username" required></div>
      <div class="field"><label for="pw">Password</label><input class="input" id="pw" type="password" autocomplete="current-password" required></div>
      <button class="pill-btn primary wide" type="submit">Sign in</button>
      <button class="link-btn" type="button" id="forgot">Forgot password?</button></form></div>`;
  $('forgot').addEventListener('click', async () => {
    const em = $('em').value.trim();
    if (!em) { toast('Enter your email first'); $('em').focus(); return; }
    try { await sendPasswordResetEmail(auth, em); toast('Password reset email sent. Check your inbox.', 4500); } catch { toast('Could not send the reset email. Check the address.'); }
  });
  $('lf').addEventListener('submit', async (e) => {
    e.preventDefault();
    try { await signInWithEmailAndPassword(auth, $('em').value.trim(), $('pw').value); } catch { toast('Sign-in failed: check your email and password'); }
  });
}

onAuthStateChanged(auth, (u) => {
  S.user = u;
  if (!u) { viewLogin(); return; }
  listen(); render();
  // Returning from an OAuth bank login (e.g. Chase): finish the Plaid connection
  const qs = new URLSearchParams(location.search);
  if (qs.has('oauth_state_id')) {
    const saved = JSON.parse(localStorage.getItem('plaidLink') || 'null');
    const href = location.href;
    history.replaceState(null, '', location.pathname + location.hash);
    if (saved) startLink(saved.token, saved.itemId, href);
  }
});
